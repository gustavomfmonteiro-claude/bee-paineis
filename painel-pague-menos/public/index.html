<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Pague Menos</title>
<link rel="icon" href="/bee.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Open+Sans:ital,wght@0,300;1,400&display=swap">
<style>
:root{
  color-scheme: dark;
  /* sala de controle: fundo frio para o amarelo Bee ser o único acento forte */
  --ground:#050911; --panel:#0C1320; --panel2:#111A29; --panel3:#1A2436;
  --line:rgba(148,170,196,.12); --line2:rgba(148,170,196,.22);
  --ink:#F2F5F9; --ink2:#AEB9C7; --ink3:#7F8C9C;
  --bee:#FFD200; --bee-d:rgba(255,210,0,.12); --bee-l:rgba(255,210,0,.38);
  /* status: reservados para bom, atenção e crítico, sempre com ícone e rótulo */
  --ok:#34E0A1; --ok-d:rgba(52,224,161,.13);
  --bad:#FF5F6D; --bad-d:rgba(255,95,109,.14);
  --warn:#FF9A3C; --warn-d:rgba(255,154,60,.14);
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --raio:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{
  margin:0;color:var(--ink);font:400 14px/1.5 var(--body);background-color:var(--ground);
}
/* fundo em camada própria: fixo sem repintar a página inteira a cada rolagem */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1000px 520px at 12% -10%, rgba(255,210,0,.09), transparent 65%),
    radial-gradient(900px 560px at 95% -5%, rgba(64,140,255,.10), transparent 62%),
    radial-gradient(rgba(148,170,196,.10) 1px, transparent 1px);
  background-size:auto,auto,26px 26px;
}
.pagina{max-width:1360px;margin:0 auto;padding:0 16px 64px}

/* barra superior */
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;
  margin:0 -16px 16px;padding:12px 16px;background:rgba(5,7,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.marca{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;min-width:0}
.marca img{height:28px;width:auto;border-radius:7px;background:#fff;padding:3px 6px}
.olho{display:block;font:500 10.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bee);margin-bottom:2px}
h1{font:700 21px/1.1 var(--display);margin:0;letter-spacing:.2px}
.sub{color:var(--ink3);font-size:12.5px}
.controles{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.relogio{font:500 13px/1 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;padding:0 2px}
select,input[type=search]{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font:500 13px var(--body);min-height:36px;outline:none;transition:border-color .15s,box-shadow .15s}
select:hover,input[type=search]:hover{border-color:rgba(148,170,196,.4)}
select:focus-visible,input[type=search]:focus-visible{border-color:var(--bee);box-shadow:0 0 0 3px var(--bee-d)}
input[type=search]{font-weight:400;width:100%;max-width:340px}
.vivo{display:inline-flex;align-items:center;gap:8px;font:500 11.5px/1 var(--mono);letter-spacing:.04em;color:var(--ink2);padding:7px 11px;border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.vivo.on{border-color:rgba(52,224,161,.35)}
.vivo.on i{background:var(--ok);animation:pulso 2s ease-out infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(52,224,161,.55)}70%{box-shadow:0 0 0 8px rgba(52,224,161,0)}100%{box-shadow:0 0 0 0 rgba(52,224,161,0)}}

.som{display:inline-flex;align-items:center;gap:7px;min-height:32px;font:500 11.5px/1 var(--mono);color:var(--ink2);padding:0 11px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);cursor:pointer;transition:border-color .15s,color .15s}
.som:hover{color:var(--ink);border-color:rgba(148,170,196,.4)}
.som:focus-visible{outline:2px solid var(--bee);outline-offset:2px}
.som.pede{border-color:var(--bee);color:var(--ink);background:var(--bee-d)}
.som.on{color:var(--ink);border-color:var(--bee-l)}
.aviso{border:1px solid var(--line);background:rgba(13,18,25,.8);border-left:2px solid var(--bee);border-radius:10px;padding:9px 14px;margin:0 0 14px;color:var(--ink2);font-size:13px}
.aviso b{color:var(--ink);font-weight:600}
.aviso.erro{border-left-color:var(--bad)}

/* superfícies */
section,.kpi{background:linear-gradient(180deg,rgba(22,32,50,.72),rgba(12,19,32,.92));border:1px solid var(--line);border-radius:var(--raio);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 12px 34px -22px rgba(0,0,0,.85)}
section{padding:18px;margin-bottom:14px;min-width:0}
h2{position:relative;font:700 14px/1.3 var(--display);margin:0 0 3px;padding-left:12px;letter-spacing:.07em;text-transform:uppercase}
h2 small.selo{text-transform:none}
h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:3px;border-radius:2px;background:var(--bee)}
.nota{color:var(--ink3);font-size:12.5px;margin:0 0 14px}
.topo-sec{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:3px}
.topo-sec h2{margin:0}
.cont{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;margin-left:8px;border-radius:999px;font:700 12.5px/1 var(--mono);color:#10130A;background:var(--bee);vertical-align:1px}
.cont.zero{background:var(--panel3);color:var(--ink2)}
.ao-vivo{border-color:var(--bee-l);box-shadow:inset 0 1px 0 rgba(255,210,0,.16),0 0 34px -18px rgba(255,210,0,.55)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-bottom:14px}
.kpis.q4{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.kpi b{white-space:nowrap}
.kpi{padding:16px 18px}
.kpi{padding:14px 15px;min-width:0;transition:border-color .18s,transform .18s}
.kpi:hover{border-color:var(--line2);transform:translateY(-1px)}
.kpi span.rot{display:block;color:var(--ink3);font:500 10.5px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.kpi b{display:block;font:700 31px/1.15 var(--display);margin:7px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.kpi small{color:var(--ink3);font-size:12px;display:block}
.medidor{height:4px;border-radius:2px;background:var(--panel3);margin:9px 0 0;overflow:hidden}
.medidor i{display:block;height:100%;border-radius:2px;background:var(--ink2)}
.medidor i.ok{background:var(--ok)}.medidor i.med{background:var(--warn)}.medidor i.mau{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--body);padding:3px 7px;border-radius:999px;color:var(--ink);white-space:nowrap}
.kpi .chip{margin-top:8px}
.chip.ok{background:var(--ok-d)}.chip.ok::before{content:"✓";color:var(--ok)}
.chip.med{background:var(--warn-d)}.chip.med::before{content:"!";color:var(--warn);font-weight:700}
.chip.mau{background:var(--bad-d)}.chip.mau::before{content:"▲";color:var(--bad);font-size:9px}

.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;margin-bottom:14px}
.grade2 section{margin:0}

/* tabelas */
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font:500 10.5px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;color:var(--ink2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(148,170,196,.06)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;padding-left:2px}
td.loja{color:var(--ink);white-space:normal;min-width:170px}
td.loja small{color:var(--ink3);margin-left:5px;font:500 10.5px var(--mono)}
td.forte{color:var(--ink);font-weight:600}
td.txt,th.txt{text-align:left;white-space:normal}
#corpoEnt td.loja{min-width:0}
.star{color:var(--bee);margin-left:4px}
.barra{display:block;height:3px;border-radius:2px;background:var(--panel3);margin-top:4px;min-width:64px}
.barra i{display:block;height:100%;border-radius:2px;background:var(--bee)}

/* barras por hora: uma série só, sem eixo duplo; o alvo de hover é a coluna inteira */
.horas{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;height:176px;align-items:end;border-bottom:1px solid var(--line2);
  background-image:linear-gradient(to top,var(--line) 1px,transparent 1px);background-size:100% 25%}
.hora{height:100%;display:flex;align-items:flex-end;cursor:default;border-radius:4px 4px 0 0}
.hora:hover{background:rgba(148,170,196,.07)}
.hora i{display:block;width:100%;background:var(--bee);border-radius:4px 4px 0 0;min-height:0}
.hora:hover i{filter:brightness(1.15)}
.eixo{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;color:var(--ink3);font:400 10.5px var(--mono);margin-top:5px}
.eixo span{text-align:center;overflow:visible;white-space:nowrap}
#dica{position:fixed;z-index:9;pointer-events:none;background:#000;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12.5px;display:none;font-variant-numeric:tabular-nums;box-shadow:0 10px 26px rgba(0,0,0,.6)}

/* motivos */
.motivo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin-bottom:10px}
.motivo .tt{color:var(--ink);font-size:13px;min-width:0}
.motivo .vv{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.motivo .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--panel3)}
.motivo .bar i{display:block;height:100%;border-radius:3px;background:#73808F}
.motivo.op .bar i{background:var(--bee)}
.tag{font:500 10px var(--mono);letter-spacing:.03em;color:var(--ink2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}

/* orientações */
.orient{display:grid;gap:9px}
.ori{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:rgba(19,26,35,.72);transition:border-color .15s}
.ori:hover{border-color:var(--line2)}
.ori h3{font:600 13.5px var(--body);margin:0}
.ori p{margin:0;grid-column:2;color:var(--ink2);font-size:13px}
.ori p b{color:var(--ink);font-weight:600}

/* cartões de loja */
.prio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.card{position:relative;border:1px solid var(--line);border-radius:12px;padding:15px;background:rgba(19,26,35,.72);min-width:0;overflow:hidden;transition:border-color .18s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,var(--bee-l),transparent 60%)}
.card:hover{border-color:var(--line2)}
.card h3{font:600 15.5px var(--display);margin:0}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;margin:12px 0 13px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini div{min-width:0}
.mini span{display:block;color:var(--ink3);font:500 10px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.mini b{font:700 18px/1.2 var(--display);font-variant-numeric:tabular-nums}
.mini small{display:block;color:var(--ink3);font-size:11px;line-height:1.3}
.card h4{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:13px 0 8px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;min-height:28px;padding-top:3px}
details summary:hover{color:var(--ink)}
.vazio{color:var(--ink3);font-size:13px;padding:6px 0}

/* requisições */
.reqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.reqs div{background:rgba(19,26,35,.72);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.reqs span{display:block;color:var(--ink3);font-size:11.5px;line-height:1.35}
.reqs b{font:700 23px/1.3 var(--display);font-variant-numeric:tabular-nums}
.reqs .tot{border-color:var(--bee-l)}
.regras{color:var(--ink2);font-size:13px;margin-bottom:0}.regras li{margin-bottom:5px}

/* entregas buscando, no formato da tela de entregas da Bee */
.busca td{vertical-align:middle;white-space:normal;text-align:left}
.busca th{text-align:left}
.busca td.nw{white-space:nowrap}
.pill{display:inline-block;font:600 11px/1 var(--body);padding:4px 8px;border-radius:999px;color:#fff;margin-bottom:5px;white-space:nowrap}
.pill.pm{background:#D93A47}.pill.ef{background:#6D4BC3}
.st{display:inline-block;font:600 10.5px/1 var(--mono);padding:5px 8px;border-radius:999px;background:var(--panel3);color:var(--ink);letter-spacing:.04em}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.modc{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:rgba(19,26,35,.72);min-width:0}
.modc h3{margin:0 0 2px;font:700 14px/1.2 var(--display)}
.modc .pz{color:var(--ink3);font:500 10.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.modc .big{display:flex;align-items:baseline;gap:8px;margin:9px 0 2px}
.modc .big b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.modc .chip{margin-left:auto}
.modc dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.modc dt{color:var(--ink3);font:500 10px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.modc dd{margin:0;font:600 14px/1.3 var(--display);font-variant-numeric:tabular-nums}
td small.b{display:block;color:var(--ink2);font-size:12px;font-weight:500}
.mod{display:inline-block;font:600 10.5px/1 var(--body);padding:4px 7px;border-radius:999px;border:1px solid var(--bee);color:var(--ink);margin-left:5px}
.busca small.total{color:var(--ink3);font-size:11px;font-weight:400}
.prox-btn{min-height:32px;padding:0 10px;font:500 12px var(--body);color:var(--ink);background:var(--panel3);border:1px solid var(--line2);border-radius:8px;cursor:pointer;white-space:nowrap;transition:border-color .15s}
.prox-btn:hover{border-color:var(--bee)}
.prox-btn:focus-visible{outline:2px solid var(--bee);outline-offset:2px}
.prox-btn[aria-expanded="true"]{border-color:var(--bee-l);background:var(--bee-d)}
.prox-linha > td{background:rgba(5,7,11,.45);padding:12px}
.prox-linha:hover{background:transparent}
/* a tabela rola na horizontal em tela estreita; os cartões ficam presos à área visível */
.prox-caixa{position:sticky;left:12px;width:min(100%,calc(100vw - 96px))}
.zap-conta{display:block;margin-bottom:4px;color:var(--ok);font:500 11px var(--mono);white-space:nowrap}
.al-prox-top{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:8px;font-size:12.5px;color:var(--ink2)}
.al-prox-top b{font-family:var(--mono);color:var(--ink)}
.al-prox-top span:last-child{margin-left:auto;color:var(--ink3);font-size:11.5px}
.al-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:7px;max-height:330px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.al-ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;background:var(--panel)}
.al-ent b{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere;color:var(--ink);line-height:1.3}
.al-ent .km{font:700 13px var(--mono);color:var(--ink);white-space:nowrap}
.al-ent small{font-size:11px;color:var(--ink3)}
.al-ent .sit{font:600 10.5px var(--mono);justify-self:end}
.al-ent .sit.livre{color:var(--ok)}.al-ent .sit.ocupado{color:#5CC8FF}
.al-acoes{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;margin-top:3px}
.al-ent .tel{font:600 12.5px var(--mono);color:var(--ink);text-decoration:none}
.al-ent a.tel:hover{color:var(--bee);text-decoration:underline}
.al-ent a.tel:focus-visible,.zap-btn:focus-visible{outline:2px solid var(--bee);outline-offset:2px}
.al-ent span.tel{color:var(--ink3);font-weight:400}
.zap-btn{font:600 11px var(--mono);color:var(--ok);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.zap-btn:hover:not(:disabled){border-color:var(--ok)}
.zap-btn:disabled{color:var(--ink3);cursor:default}
.zap-erro{grid-column:1/-1;font-size:11px;color:var(--bad);margin-top:2px}
#zapDlg{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:18px;width:min(420px,calc(100vw - 32px))}
#zapDlg::backdrop{background:rgba(0,0,0,.6)}
#zapDlg h3{margin:0 0 4px;font:600 15px var(--display)}
#zapDlg p{margin:0 0 10px;font-size:12.5px;color:var(--ink2)}
#zapDlg blockquote{margin:0 0 12px;padding:9px 11px;border-left:3px solid var(--ok);background:var(--panel2);font-size:13px;line-height:1.4}
.zap-acoes{display:flex;justify-content:flex-end;gap:8px}
.zap-acoes button{min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font:600 13px var(--body);cursor:pointer}
.zap-acoes button[type=submit]{background:var(--ok);border-color:var(--ok);color:#06140E}
/* evolução: duas bandeiras em barras empilhadas; cores validadas no fundo escuro (CVD ΔE 19,9) */
.evo-ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.evo-seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.evo-seg button{min-height:34px;padding:0 12px;background:var(--panel2);color:var(--ink2);border:0;border-right:1px solid var(--line2);font:500 12.5px var(--body);cursor:pointer}
.evo-seg button:last-child{border-right:0}
.evo-seg button:hover{color:var(--ink)}
.evo-seg button[aria-pressed="true"]{background:var(--bee-d);color:var(--ink);box-shadow:inset 0 -2px 0 var(--bee)}
.evo-seg button:focus-visible{outline:2px solid var(--bee);outline-offset:-2px}
.per{display:flex;flex-direction:column;gap:3px;color:var(--ink3);font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.per input{min-width:138px}
.hoje-x{background:transparent;color:var(--ink2);border:1px solid var(--line2);border-radius:9px;padding:0 11px;min-height:36px;font:600 12px var(--body);cursor:pointer;align-self:flex-end}
.hoje:hover{border-color:var(--bee);color:var(--ink)}.hoje[hidden]{display:none}
input[type=date]{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:6px 9px;font:500 13px var(--body);min-height:36px;color-scheme:dark}
.evo-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 14px}
.evo-tile{background:rgba(19,26,35,.72);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.evo-tile span{display:block;color:var(--ink3);font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase}

.filtro-periodo{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:12px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:var(--raio);background:linear-gradient(180deg,rgba(22,32,50,.72),rgba(12,19,32,.92))}

.fp-presets button:hover{color:var(--ink);border-color:rgba(148,170,196,.45)}

.pontas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px;margin-top:2px}
.pontas div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(19,26,35,.55);min-width:0}
.pontas span{display:block;color:var(--ink3);font:500 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.pontas b{font:700 20px/1.2 var(--display);font-variant-numeric:tabular-nums}
.pontas small{display:block;color:var(--ink3);font-size:11px;margin-top:2px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:14px;margin-bottom:14px}
.modgrid section{margin:0}
.modsec .kpis{margin:10px 0}
.sub-h{font:600 12.5px/1.3 var(--display);color:var(--ink2);margin:16px 0 7px}
.selo{font:500 11px var(--mono);color:var(--ink3);margin-left:6px;letter-spacing:.03em}
.grade2.dentro{margin:6px 0 0}
td.quente{color:var(--warn);font-weight:600}
</style>

      <button type="button" data-p="hoje">Hoje</button><button type="button" data-p="ontem">Ontem</button><button type="button" data-p="7">7 dias</button><button type="button" data-p="30">30 dias</button><button type="button" data-p="mes">Este mês</button><button type="button" data-p="mesAnt">Mês anterior</button><button type="button" data-p="ano">Este ano</button></div></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR'));
const pc = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%');
const min = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' min');
const dataBr = (d) => d.split('-').reverse().join('/');
// texto e hora dos blocos seguem o que está sendo desenhado: o dia ao vivo ou o período dos Dados gerais
let ctxA = null;
const neste = () => (ctxA?.periodo ? 'no período' : 'neste dia');
const doPer = () => (ctxA?.periodo ? 'do período' : 'do dia');
// hora do cancelamento; num período leva a data junto
const horaCanc = (c) => (ctxA?.periodo && c.dia ? `${c.dia.slice(8)}/${c.dia.slice(5, 7)} ` : '') + c.h;
const quando = (iso) => new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Fortaleza', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
// Faixas de leitura do OTD: as mesmas das orientações (abaixo de 70% aciona ajuste).
function chipOtd(v) {
  if (v == null) return '';
  if (v >= 85) return '<span class="chip ok">Bom</span>';
  if (v >= 70) return '<span class="chip med">Atenção</span>';
  return '<span class="chip mau">Crítico</span>';
}
const nomeLoja = (l) => `${l.num ? esc(l.num) + ' · ' : ''}${esc(l.bairro)}<small>${l.band}</small>${PRIO.includes(l.num) ? '<span class="star" title="Loja prioritária">★</span>' : ''}`;
const PRIO = ['678', '7300', '933', '495', '890', '7362', '839', '7356', '63', '715', '7515'];
const LISTA_PRIO = `${PRIO.slice(0, -1).join(', ')} e ${PRIO[PRIO.length - 1]}`;

// Filtro De/Até: vazio = dia mais recente, ao vivo. Período soma os dias que o painel tem gravados.
let periodo = { de: '', ate: '' }, presetAtivo = 'mes', dadosP = null, dados = null, busca = '', busc = null, periodoEnt = 'd30', filtroCanc = 'todas';

function kpi(rot, val, extra, chip, medidor) {
  return `<div class="kpi"><span class="rot">${rot}</span><b>${val}</b><small>${extra || ''}</small>${medidor || ''}${chip || ''}</div>`;
}
// Medidor de 0 a 100%. Cor de status só onde há faixa definida (OTD); o resto fica neutro.
const classeOtd = (v) => (v >= 85 ? 'ok' : v >= 70 ? 'med' : 'mau');
const medidor = (v, classe = '') => (v == null ? '' : `<div class="medidor" aria-hidden="true"><i class="${classe}" style="width:${Math.min(100, v)}%"></i></div>`);

// ------------------------------------------------------------------ gráficos
// Gráficos em SVG desenhados na largura real do bloco (texto nítido em qualquer tela), redesenhados
// quando a janela muda. Uma escala por gráfico, nunca eixo duplo. Cada coluna ou ponto tem dica ao passar o mouse.
// Cores validadas no fundo escuro do painel (contraste e daltonismo): modalidade, pontas, bandeira e fase.
const COR = {
  volume: '#FFD200',                                         // volume (pedidos, entregas): o amarelo Bee, série única
  'Super Expressa': '#3987e5', Expressa: '#d95926', 'Econômica': '#199e70', Agendada: '#73808F', 'Padrão': '#56606D',
  p1: '#9085e9', espera: '#73808F', p2: '#d55181', geral: '#E6EBF2', // ponta 1 / loja, espera, ponta 2 / cliente
  PM: '#E0505C', EF: '#7E63D6',
  op: '#FFD200', naoOp: '#73808F',
  fase: ['#86b6ef', '#3987e5', '#1c5cab'],
  fundo: '#0F1726',
};
const GRAF = new Map();
let grafSeq = 0;
// Marca o lugar do gráfico; o desenho sai em montarGraficos(), depois que o bloco está na página e tem largura.
function graf(spec) {
  const id = 'g' + ++grafSeq;
  GRAF.set(id, spec);
  return `<div class="graf" data-graf="${id}" style="height:${spec.altura || 290}px" role="img" aria-label="${esc(spec.titulo || '')}"></div>`;
}
function montarGraficos() {
  const vivos = new Set();
  let semLargura = 0;
  for (const el of document.querySelectorAll('.graf[data-graf]')) {
    const s = GRAF.get(el.dataset.graf);
    if (!s) continue;
    vivos.add(el.dataset.graf);
    if (el.offsetParent === null) continue; // aba escondida: desenha quando aparecer
    if (el.clientWidth < 60) { semLargura++; continue; } // página ainda sem layout: tenta de novo logo
    el.innerHTML = (s.tipo === 'linhas' ? svgLinhas : svgColunas)(s, el.clientWidth, el.clientHeight);
  }
  for (const k of GRAF.keys()) if (!vivos.has(k)) GRAF.delete(k);
  if (semLargura && tentativasGraf++ < 20) setTimeout(montarGraficos, 400); else if (!semLargura) tentativasGraf = 0;
}
let tentativasGraf = 0;
let redesenhoJanela = null;
addEventListener('resize', () => { clearTimeout(redesenhoJanela); redesenhoJanela = setTimeout(montarGraficos, 150); });

function escalaEixo(max, n = 4) {
  if (!(max > 0)) return { max: 1, passo: 1 };
  const bruto = max / n, p = 10 ** Math.floor(Math.log10(bruto));
  const passo = [1, 2, 2.5, 5, 10].find((m) => m * p >= bruto) * p;
  return { max: Math.ceil(max / passo - 1e-9) * passo, passo };
}
const eixoNum = (v) => (v >= 10000 ? num(Math.round(v / 100) / 10) + ' mil' : num(Math.round(v * 10) / 10));
// coluna com a ponta arredondada (4px) e a base reta
function colPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function grade(s, W, esq, dir, y, e) {
  let g = '';
  for (let v = 0; v <= e.max + 1e-9; v += e.passo) {
    g += `<line x1="${esq}" x2="${W - dir}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="${v === 0 ? 'g-base' : 'g-linha'}"/>`
      + `<text x="${esq - 6}" y="${(y(v) + 3.5).toFixed(1)}" class="g-tk" text-anchor="end">${s.pct ? num(v) + '%' : eixoNum(v)}</text>`;
  }
  if (s.ref != null) {
    const yy = y(s.ref).toFixed(1);
    g += `<line x1="${esq}" x2="${W - dir}" y1="${yy}" y2="${yy}" class="g-ref"/><text x="${W - dir}" y="${yy - 4}" class="g-tk ref" text-anchor="end">${esc(s.refRot || '')}</text>`;
  }
  return g;
}

// Colunas: uma série, várias lado a lado ou empilhadas (2px de fundo entre os segmentos).
// spec: { cats, series: [{ nome, cor, vals }], empilhado, pct, ref, refRot, rotulos, fmt, tip(i) }
function svgColunas(s, W, H) {
  const n = s.cats.length;
  if (!n || W < 60) return '';
  const esq = 46, dir = 6, topo = s.rotulos ? 24 : 12, base = 26;
  const pw = W - esq - dir, ph = H - topo - base;
  const tot = s.cats.map((_, i) => (s.empilhado ? s.series.reduce((t, x) => t + (x.vals[i] || 0), 0) : Math.max(0, ...s.series.map((x) => x.vals[i] || 0))));
  const e = s.pct ? { max: 100, passo: 25 } : escalaEixo(Math.max(...tot, s.ref || 0));
  const y = (v) => topo + ph - (Math.min(v, e.max) / e.max) * ph;
  const banda = pw / n, ns = s.empilhado ? 1 : s.series.length;
  const bw = Math.max(3, Math.min(24, (banda * 0.72 - 2 * (ns - 1)) / ns));
  const cada = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 38))));
  const fmt = s.fmt || num;
  let marcas = '', alvos = '';
  s.cats.forEach((c, i) => {
    const x0 = esq + banda * i + (banda - (bw * ns + 2 * (ns - 1))) / 2;
    if (s.empilhado) {
      const vs = s.series.map((x) => x.vals[i] || 0);
      const ultimo = vs.reduce((k, v, j) => (v > 0 ? j : k), -1);
      let acc = 0;
      vs.forEach((v, j) => {
        if (!v) return;
        const y1 = y(acc + v), h = y(acc) - y1 - (acc > 0 ? 2 : 0);
        acc += v;
        if (h > 0.5) marcas += `<path d="${colPath(x0, y1, bw, h, j === ultimo ? 4 : 0)}" fill="${s.series[j].cor}"/>`;
      });
    } else {
      s.series.forEach((x, j) => {
        const v = x.vals[i];
        if (v == null || v <= 0) return;
        const y1 = y(v);
        marcas += `<path d="${colPath(x0 + j * (bw + 2), y1, bw, topo + ph - y1, 4)}" fill="${x.cor}"/>`;
        if (s.rotulos && ns === 1 && banda >= 26) marcas += `<text x="${(x0 + bw / 2).toFixed(1)}" y="${(y1 - 7).toFixed(1)}" class="g-vl" text-anchor="middle">${fmt(v)}</text>`;
      });
    }
    if (i % cada === 0) marcas += `<text x="${(esq + banda * i + banda / 2).toFixed(1)}" y="${H - 8}" class="g-tk" text-anchor="middle">${esc(c)}</text>`;
    alvos += `<rect x="${(esq + banda * i).toFixed(1)}" y="${topo}" width="${banda.toFixed(1)}" height="${ph}" class="g-alvo" data-tip="${esc(s.tip ? s.tip(i) : `<b>${esc(c)}</b><br>${fmt(tot[i])}`)}"/>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grade(s, W, esq, dir, y, e)}${marcas}${alvos}</svg>`;
}

// Linhas de 0 a 100%: 2px, pontos de 8px com anel do fundo; sem valor (null) quebra a linha.
// Passar o mouse numa coluna mostra a linha-guia e a dica com todas as séries.
function svgLinhas(s, W, H) {
  const n = s.cats.length;
  if (!n || W < 60) return '';
  const esq = 46, dir = 8, topo = 14, base = 26;
  const pw = W - esq - dir, ph = H - topo - base;
  const e = s.pct ? { max: 100, passo: 25 } : escalaEixo(Math.max(0, ...s.series.flatMap((x) => x.vals.filter((v) => v != null))));
  const y = (v) => topo + ph - (Math.min(v, e.max) / e.max) * ph;
  const banda = pw / n, x = (i) => esq + banda * i + banda / 2;
  const cada = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 38))));
  let linhas = '', pontos = '', eixo = '', alvos = '';
  for (const sr of s.series) {
    let d = '', aberto = false;
    sr.vals.forEach((v, i) => {
      if (v == null) { aberto = false; return; }
      d += `${aberto ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      aberto = true;
      pontos += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="5" fill="${sr.cor}" stroke="${COR.fundo}" stroke-width="2"/>`;
    });
    linhas += `<path d="${d}" fill="none" stroke="${sr.cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  s.cats.forEach((c, i) => {
    if (i % cada === 0) eixo += `<text x="${x(i).toFixed(1)}" y="${H - 8}" class="g-tk" text-anchor="middle">${esc(c)}</text>`;
    const dica = s.tip ? s.tip(i) : `<b>${esc(c)}</b>` + s.series.map((sr) => `<br><i class="ch" style="background:${sr.cor}"></i>${esc(sr.nome)}: ${sr.vals[i] == null ? '—' : (s.fmt || pc)(sr.vals[i])}`).join('');
    alvos += `<g class="g-alvo-l"><line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${topo}" y2="${topo + ph}" class="g-guia"/><rect x="${(esq + banda * i).toFixed(1)}" y="${topo}" width="${banda.toFixed(1)}" height="${ph}" fill="transparent" data-tip="${esc(dica)}"/></g>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grade(s, W, esq, dir, y, e)}${alvos}${linhas}${pontos}</svg>`;
}

const BASE_MIN_PCT = 10; // entregas mínimas para um percentual entrar no gráfico

// Legenda: sempre que houver duas séries ou mais.
const legenda = (itens) => `<div class="leg">${itens.map((x) => `<span><i style="background:${x.cor}"></i>${esc(x.nome)}</span>`).join('')}</div>`;

// Barras horizontais em HTML (rótulo, trilho, valor na ponta); `ref` desenha a marca de referência.
function hbarras(itens, { max = 100, ref = null, fmt = pc, largo = false } = {}) {
  if (!itens.length) return '<p class="vazio">Sem dados.</p>';
  return `<div class="hb${largo ? ' largo' : ''}">${itens.map((it) => {
    const w = max ? Math.max(0, Math.min(100, (100 * (it.val || 0)) / max)) : 0;
    return `<div class="hb-l"${it.tip ? ` data-tip="${esc(it.tip)}"` : ''}><div class="hb-r">${esc(it.rot)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>
      <div class="hb-t"><i style="width:${w}%;background:${it.cor || COR.volume}"></i>${ref != null ? `<b class="hb-ref" style="left:${(100 * ref) / max}%"></b>` : ''}</div>
      <div class="hb-v">${it.val == null ? '—' : fmt(it.val)}${it.extra || ''}</div></div>`;
  }).join('')}</div>`;
}

// Barras horizontais empilhadas (partes de um tempo ou de um total), com marca opcional por linha.
function hpilhas(linhas, { max, fmt = min, marca = null } = {}) {
  const m = max || Math.max(1, ...linhas.map((l) => Math.max(l.partes.reduce((t, p) => t + (p.val || 0), 0), marca ? marca(l) || 0 : 0)));
  return `<div class="hb">${linhas.map((l) => {
    const total = l.partes.reduce((t, p) => t + (p.val || 0), 0);
    const mk = marca ? marca(l) : null;
    const partes = l.partes.filter((p) => p.val > 0).map((p) => `<i style="width:${(100 * p.val) / m}%;background:${p.cor}" data-tip="${esc(`<b>${esc(l.rot)}</b><br><i class="ch" style="background:${p.cor}"></i>${esc(p.nome)}: ${fmt(p.val)}`)}"></i>`).join('');
    return `<div class="hb-l"${l.tip ? ` data-tip="${esc(l.tip)}"` : ''}><div class="hb-r">${esc(l.rot)}${l.sub ? `<small>${esc(l.sub)}</small>` : ''}</div>
      <div class="hb-t pilha">${partes}${mk != null ? `<b class="hb-ref" style="left:${Math.min(100, (100 * mk) / m)}%"></b>` : ''}</div>
      <div class="hb-v">${l.valor ?? fmt(total)}</div></div>`;
  }).join('')}</div>`;
}

// Barra segmentada (um todo dividido em partes): bloco de 28px, a parte mostra a fatia quando cabe.
function segmentos(partes, { fmt = num } = {}) {
  const tot = partes.reduce((t, p) => t + (p.val || 0), 0);
  if (!tot) return '<p class="vazio">Sem dados.</p>';
  const blocos = partes.filter((p) => p.val > 0).map((p) => {
    const f = (100 * p.val) / tot;
    return `<i${f < 12 ? ' class="estreita"' : ''} style="flex:${p.val} 1 0;background:${p.cor}${p.claro ? ';color:#0b0b0b' : ''}" data-tip="${esc(`<b>${esc(p.nome)}</b><br>${fmt(p.val)} · ${pc(Math.round(f * 10) / 10)}`)}">${f >= 6 ? pc(Math.round(f)) : ''}</i>`;
  }).join('');
  return `<div class="seg" role="img" aria-label="${esc(partes.map((p) => `${p.nome} ${fmt(p.val)}`).join(', '))}">${blocos}</div>${legenda(partes.filter((p) => p.val > 0))}`;
}

// Anel de 0 a 100% para os indicadores; a cor de status só onde existe faixa definida (OTD).
function anel(v, classe = '') {
  const r = 40, c = 2 * Math.PI * r, p = v == null ? 0 : Math.max(0, Math.min(100, v));
  return `<svg class="anel ${classe}" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true"><circle cx="48" cy="48" r="${r}" class="trilho"/><circle cx="48" cy="48" r="${r}" class="arco" stroke-dasharray="${((c * p) / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 48 48)"/><text x="48" y="55" text-anchor="middle">${v == null ? '—' : Math.round(v) + '%'}</text></svg>`;
}
// Indicador com anel à esquerda
function kpiA(rot, val, extra, v, classe, chip, destaque) {
  const d = destaque ? `<span class="pct ${destaque.cor || ''}">${destaque.v}<em>${destaque.rot}</em></span>` : '';
  return `<div class="kpi kpi-a">${anel(v, classe)}<div><span class="rot">${rot}</span><b>${val}</b>${d}<small>${extra || ''}</small>${chip || ''}</div></div>`;
}
// Linha de tendência curta, sem eixo, para o indicador de demanda (pedidos por hora).
function minilinha(vals) {
  const mx = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v, i) => `${((100 * i) / Math.max(1, n - 1)).toFixed(2)},${(28 - (26 * v) / mx).toFixed(2)}`).join(' ');
  return `<svg class="mini" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,30 ${pts} 100,30" fill="rgba(255,210,0,.10)"/><polyline points="${pts}" fill="none" stroke="${COR.volume}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function blocoKpis(a) {
  const k = a.kpis, taxaFin = k.dem ? Math.round((1000 * k.fin) / k.dem) / 10 : null;
  const pontas = k.p1Med != null && k.p2Med != null ? `<div class="seg fino" aria-hidden="true"><i style="flex:${k.p1Med} 1 0;background:${COR.p1}"></i><i style="flex:${k.p2Med} 1 0;background:${COR.p2}"></i></div>` : '';
  return `<div class="kpis">
    <div class="kpi"><span class="rot">Demanda</span><b>${num(k.dem)}</b><small>${num(k.lojas)} lojas com pedido · por hora</small>${minilinha(a.horas.map((h) => h[0]))}</div>
    ${kpiA('Finalizadas', num(k.fin), k.and ? `${num(k.and)} ainda em outros status` : '', taxaFin, 'fin', '', { v: pc(taxaFin), rot: 'dos pedidos', cor: 'ok' })}
    ${kpiA('Cancelamentos', num(k.canc), `${num(k.cOp)} operacionais`, k.taxaCanc, 'canc', '', { v: pc(k.taxaCanc), rot: 'da demanda', cor: 'mau' })}
    ${kpiA('Aceite médio', min(k.aceite), k.direto ? `${num(k.direto)} sem busca` : '', k.pctAte5, 'neutro', '', { v: pc(k.pctAte5), rot: 'em até 5 min', cor: 'azul' })}
    ${kpiA('OTD no prazo da modalidade', pc(k.otd), k.otdN ? `${num(k.otdN)} entregas, cada uma no próprio prazo` : 'sem entregas finalizadas', k.otd, classeOtd(k.otd), chipOtd(k.otd))}
    <div class="kpi"><span class="rot">Tempo das pontas</span><b class="duplo">${min(k.p1Med)}<span>+</span>${min(k.p2Med)}</b><small><i class="ch" style="background:${COR.p1}"></i>até a loja · <i class="ch" style="background:${COR.p2}"></i>loja ao cliente</small>${pontas}</div>
  </div>`;
}

// OTD por modalidade: Super Expressa 30 min, Expressa 60 min, Econômica 2 h, da criação à chegada no cliente.
const PRAZO_TXT = { 'Super Expressa': '30 min', Expressa: '60 min', 'Econômica': '2 h' };
const prazoTxt = (m) => PRAZO_TXT[m] || 'sem prazo';
const ORDEM_MODS = ['Super Expressa', 'Expressa', 'Econômica'];
const achaMod = (k, m) => (k?.mods || []).find((x) => x.mod === m);
// célula de tabela: OTD da modalidade com a base embaixo
const celMod = (k, m) => { const x = achaMod(k, m); return `<td>${x?.otdN ? `${pc(x.otd)}<small class="b">${num(x.noPrazo)} de ${num(x.otdN)} no prazo</small>` : '—'}</td>`; };
const thMods = ORDEM_MODS.map((m) => `<th>OTD ${m}<small class="b">${prazoTxt(m)}</small></th>`).join('');

// Quadro por KM: faixas de 1 km, como no Power BI. Ícone pelos mesmos selos de OTD do painel.
const icone = (v) => (v == null ? '' : v >= 85 ? '<span class="ic ok" aria-label="Bom">✓</span>' : v >= 70 ? '<span class="ic med" aria-label="Atenção">!</span>' : '<span class="ic mau" aria-label="Crítico">✕</span>');
const celPc = (v, sep) => `<td class="pc${sep ? ' sep' : ''}">${icone(v)}${pc(v)}</td>`;
function blocoKm(a) {
  const q = a.porKm;
  if (!q) return `<section><h2>Entregas por KM</h2><p class="vazio">Este período tem dias gravados antes dos pedidos um a um; eles estão sendo relidos.</p></section>`;
  const porI = new Map(q.linhas.filter((x) => x.faixa !== 'Sem distância').map((x) => [parseInt(x.faixa, 10), x]));
  const ultimo = Math.min(14, Math.max(-1, ...porI.keys()));
  const idx = Array.from({ length: ultimo + 1 }, (_, i) => i);
  const cats = idx.map((i) => `${i}–${i + 1}`);
  const linha = (i) => porI.get(i);
  const dicaKm = (i) => { const x = linha(i); return x ? `<b>${esc(x.faixa)}</b><br>${num(x.fin)} finalizadas · base ${num(x.base)}<br><i class="ch" style="background:${COR.geral}"></i>Geral ${pc(x.geral)}<br><i class="ch" style="background:${COR.p1}"></i>Loja ${pc(x.loja)}<br><i class="ch" style="background:${COR.p2}"></i>Cliente ${pc(x.cliente)}<br>Espera na loja ${min(x.espera)}` : `<b>${i}–${i + 1} km</b><br>Nenhuma entrega`; };
  const grafVol = graf({ tipo: 'colunas', titulo: 'Entregas finalizadas por faixa de 1 km', cats, series: [{ nome: 'Finalizadas', cor: COR.volume, vals: idx.map((i) => linha(i)?.fin || 0) }], rotulos: true, tip: dicaKm });
  const serie = (nome, cor, campo) => ({ nome, cor, vals: idx.map((i) => (linha(i)?.base >= BASE_MIN_PCT ? linha(i)[campo] : null)) });
  const grafOtd = graf({ tipo: 'linhas', titulo: 'Percentual on time por faixa de 1 km', cats, pct: true, ref: 85, refRot: '85%: bom', series: [serie('Geral · até 30 min', COR.geral, 'geral'), serie('Loja · ponta 1 até 15 min', COR.p1, 'loja'), serie('Cliente · ponta 2 até 15 min', COR.p2, 'cliente')], tip: dicaKm });
  const t = q.total;
  const lin = (x, tag = 'td') => `<tr><${tag} class="loja">${esc(x.faixa)}</${tag}><td class="forte">${num(x.fin)}</td><td>${num(x.base)}</td>
    <td class="sep">${num(x.geralOn)}</td><td>${num(x.geralOff)}</td>${celPc(x.geral)}
    <td class="sep">${num(x.lojaOn)}</td><td>${num(x.lojaOff)}</td>${celPc(x.loja)}
    <td class="sep">${num(x.clienteOn)}</td><td>${num(x.clienteOff)}</td>${celPc(x.cliente)}
    <td class="sep">${min(x.espera)}</td>${celPc(x.modalidade, false)}</tr>`;
  return `<section><div class="topo-sec"><h2>Entregas por KM</h2><span class="sub">${num(t.fin)} finalizadas · base ${num(t.base)} com os dois tempos</span></div>
  <p class="nota">On time geral: ponta 1 + ponta 2 em até 30 min. Loja: da criação à chegada na loja em até 15 min. Cliente: da saída da loja à chegada no cliente em até 15 min.</p>
  <div class="numeros">
    <div><span>Geral</span><b>${icone(t.geral)}${pc(t.geral)}</b><small>${num(t.geralOn)} on time · ${num(t.geralOff)} off</small></div>
    <div><span><i class="ch" style="background:${COR.p1}"></i>Loja</span><b>${icone(t.loja)}${pc(t.loja)}</b><small>${num(t.lojaOn)} on time · ${num(t.lojaOff)} off</small></div>
    <div><span><i class="ch" style="background:${COR.p2}"></i>Cliente</span><b>${icone(t.cliente)}${pc(t.cliente)}</b><small>${num(t.clienteOn)} on time · ${num(t.clienteOff)} off</small></div>
    <div><span>Espera na loja</span><b>${min(t.espera)}</b><small>média das finalizadas</small></div>
    <div><span>OTD da modalidade</span><b>${icone(t.modalidade)}${pc(t.modalidade)}</b><small>30 min · 60 min · 2 h</small></div>
  </div>
  <div class="duo"><div><h3 class="sub-h">Entregas finalizadas por faixa (km)</h3>${grafVol}</div>
    <div><h3 class="sub-h">On time por faixa (km) · faixas com ${BASE_MIN_PCT}+ entregas</h3>${legenda([{ nome: 'Geral', cor: COR.geral }, { nome: 'Loja', cor: COR.p1 }, { nome: 'Cliente', cor: COR.p2 }])}${grafOtd}</div></div>
  ${ultimo < Math.max(...porI.keys(), 0) ? '<p class="nota pe">Gráficos até 15 km; as faixas acima disso estão na tabela.</p>' : ''}
  <details data-chave="tabela-km"><summary>Ver a tabela por faixa de 1 km</summary><div class="rolagem"><table class="km"><thead>
    <tr><th rowspan="2">KM</th><th rowspan="2">Finalizadas</th><th rowspan="2">Com os dois tempos</th><th colspan="3" class="grp sep">Geral · até 30 min</th><th colspan="3" class="grp sep">Loja · ponta 1 até 15 min</th><th colspan="3" class="grp sep">Cliente · ponta 2 até 15 min</th><th rowspan="2" class="sep">Espera na loja</th><th rowspan="2">OTD da modalidade</th></tr>
    <tr><th class="sep">On time</th><th>Off time</th><th>%</th><th class="sep">On time</th><th>Off time</th><th>%</th><th class="sep">On time</th><th>Off time</th><th>%</th></tr>
  </thead><tbody>${q.linhas.map((x) => lin(x)).join('') || '<tr><td colspan="14" class="vazio">Nenhuma entrega finalizada.</td></tr>'}</tbody>
  <tfoot>${lin(t)}</tfoot></table></div></details></section>`;
}

function blocoModalidades(a) {
  const k = a.kpis;
  if (!k.mods?.length) return `<section><h2>OTD por modalidade</h2><p class="vazio">Este dia foi gravado antes da separação por modalidade e ainda não foi relido.</p></section>`;
  const band = (b, m) => { const x = achaMod(a.bandeiras[b], m); return x?.otdN ? pc(x.otd) : '—'; };
  const comPrazo = k.mods.filter((x) => x.prazo);
  const barras = hbarras(comPrazo.map((x) => ({
    rot: x.mod, sub: prazoTxt(x.mod), val: x.otdN ? x.otd : null, cor: COR[x.mod],
    extra: ` <small>${num(x.noPrazo)} de ${num(x.otdN)}</small>`,
    tip: `<b>${esc(x.mod)}</b> · prazo de ${prazoTxt(x.mod)}<br>${num(x.noPrazo)} de ${num(x.otdN)} no prazo<br>Pague Menos ${band('PM', x.mod)} · Extrafarma ${band('EF', x.mod)}<br>Tempo médio até o cliente ${min(x.tempo)}`,
  })), { ref: 85 });
  const seg = segmentos(k.mods.map((x) => ({ nome: x.mod, val: x.dem, cor: COR[x.mod] || COR.Agendada })));
  const tabela = `<div class="rolagem"><table><thead><tr><th>Modalidade</th><th>Pedidos</th><th>Finalizadas</th><th>Canceladas</th><th>Até o cliente</th></tr></thead><tbody>${k.mods.map((x) => `<tr><td class="loja"><i class="ch" style="background:${COR[x.mod] || COR.Agendada}"></i>${esc(x.mod)}</td><td class="forte">${num(x.dem)}</td><td>${num(x.fin)}</td><td>${num(x.canc)}<small class="b">${pc(x.taxaCanc)}</small></td><td>${min(x.tempo)}</td></tr>`).join('')}</tbody></table></div>`;
  return `<section><h2>OTD por modalidade</h2><p class="nota">Finalizada que chegou ao cliente dentro do prazo da modalidade, contado da criação do pedido. Passe o mouse na barra para ver Pague Menos e Extrafarma.</p>
    <div class="duo"><div><h3 class="sub-h">No prazo da modalidade</h3>${barras}<p class="nota pe">A marca em 85% é o início da faixa Bom.</p></div>
    <div><h3 class="sub-h">Pedidos por modalidade</h3>${seg}${tabela}</div></div></section>`;
}

function blocoBandeiras(a) {
  const lin = (rot, k) => `<tr><td class="loja"><i class="ch" style="background:${rot === 'Pague Menos' ? COR.PM : COR.EF}"></i>${rot}</td><td class="forte">${num(k.dem)}</td><td>${num(k.fin)}</td><td>${num(k.canc)}</td><td>${pc(k.taxaCanc)}</td><td>${num(k.cOp)}</td><td>${num(k.c05)}</td><td>${min(k.aceite)}</td>${ORDEM_MODS.map((m) => celMod(k, m)).join('')}<td>${pc(k.otd)}</td></tr>`;
  return `<section><h2>Por bandeira</h2><p class="nota">Participação na demanda e indicadores de cada bandeira. OTD de cada modalidade no próprio prazo; embaixo do percentual, as entregas no prazo e as finalizadas.</p>
  ${segmentos([{ nome: 'Pague Menos', val: a.bandeiras.PM.dem, cor: COR.PM }, { nome: 'Extrafarma', val: a.bandeiras.EF.dem, cor: COR.EF }], { fmt: (v) => num(v) + ' pedidos' })}
  <div class="rolagem"><table><thead><tr><th>Bandeira</th><th>Demanda</th><th>Finalizadas</th><th>Canceladas</th><th>% canc.</th><th>Operacional</th><th>0 a 5 min</th><th>Aceite</th>${thMods}<th>OTD geral</th></tr></thead>
  <tbody>${lin('Pague Menos', a.bandeiras.PM)}${lin('Extrafarma', a.bandeiras.EF)}</tbody></table></div></section>`;
}

function blocoHoras(a) {
  const pico = a.horas.reduce((b, h, i) => (h[0] > a.horas[b][0] ? i : b), 0);
  const cats = a.horas.map((_, i) => String(i).padStart(2, '0') + 'h');
  const g = graf({ tipo: 'colunas', titulo: 'Pedidos criados por hora', altura: 260, cats, series: [{ nome: 'Pedidos', cor: COR.volume, vals: a.horas.map((h) => h[0]) }],
    tip: (i) => { const h = a.horas[i]; return `<b>${cats[i]}</b> · ${num(h[0])} pedidos<br>${num(h[1])} finalizados · ${num(h[2])} cancelados${h[0] ? ` (${pc(Math.round((1000 * h[2]) / h[0]) / 10)})` : ''}`; } });
  return `<section><h2>Demanda por hora</h2><p class="nota">Pico às ${String(pico).padStart(2, '0')}h, com ${num(a.horas[pico][0])} pedidos criados. Passe o mouse para ver finalizados e cancelados.</p>${g}</section>`;
}

// Cancelamentos das lojas prioritárias: resumo por loja e lista, do mais recente para o mais antigo.
function linhasCancPrioridade(a) {
  const todos = [];
  for (const l of a.prioridade) if (!l.semPedidos && (filtroCanc === 'todas' || filtroCanc === l.num)) for (const c of l.cancelamentos) todos.push({ ...c, num: l.num, bairro: l.bairro });
  todos.sort((x, y) => ((y.dia || '') + y.h).localeCompare((x.dia || '') + x.h));
  if (!todos.length) return `<p class="vazio">Nenhum cancelamento ${neste()}.</p>`;
  return `<div class="rolagem"><table><thead><tr><th>Hora</th><th class="txt">Loja</th><th class="txt">Modalidade</th><th>Até cancelar</th><th class="txt">Fase</th><th class="txt">Motivo</th><th class="txt">Tipo</th><th>Pedido</th></tr></thead><tbody>${todos.map((c) => `<tr><td class="forte nw">${esc(horaCanc(c))}</td><td class="txt">${esc(c.num)} · ${esc(c.bairro)}</td><td class="txt">${esc(c.mod || '—')}</td><td>${min(c.min)}</td><td class="txt">${esc(c.fase)}</td><td class="txt">${esc(c.motivo)}</td><td class="txt">${c.op ? '<span class="tag" style="margin:0">Operacional</span>' : esc(c.grupo)}</td><td>${esc(c.id)}</td></tr>`).join('')}</tbody></table></div>`;
}
function blocoCancPrioridade(a) {
  const ls = a.prioridade;
  const antes = (l) => l.cancelamentos.filter((c) => c.fase === 'Antes do aceite').length;
  const linha = (l) => (l.semPedidos
    ? `<tr><td class="loja">${esc(l.num)}${l.bairro ? ' · ' + esc(l.bairro) : ''}${l.band ? `<small>${l.band}</small>` : ''}</td><td class="forte">0</td><td>—</td><td>0</td><td>0</td><td>0</td><td class="txt">Sem pedidos ${neste()}</td></tr>`
    : `<tr><td class="loja">${esc(l.num)} · ${esc(l.bairro)}<small>${l.band}</small></td><td class="forte">${num(l.canc)}</td><td>${pc(l.taxaCanc)}</td><td>${num(l.cOp)}</td><td>${num(l.c05)}</td><td>${num(antes(l))}</td><td class="txt">${l.motivos.length ? `${esc(l.motivos[0].motivo)} (${num(l.motivos[0].n)})` : '—'}</td></tr>`);
  const total = ls.reduce((t, l) => t + (l.canc || 0), 0);
  const opcoes = [['todas', 'Todas as lojas'], ...ls.map((l) => [l.num, 'Loja ' + l.num])].map(([v, r]) => `<option value="${v}"${v === filtroCanc ? ' selected' : ''}>${r}</option>`).join('');
  return `<section><div class="topo-sec"><h2>Cancelamentos das lojas prioritárias<span class="cont ${total ? '' : 'zero'}">${num(total)}</span></h2><select id="filtroCanc" aria-label="Filtrar cancelamentos por loja">${opcoes}</select></div>
    <p class="nota">Resumo por loja e cada cancelamento ${doPer()}, do mais recente para o mais antigo.</p>
    <div class="rolagem" style="margin-bottom:14px"><table><thead><tr><th>Loja</th><th>Canceladas</th><th>% da demanda</th><th>Operacional</th><th>0 a 5 min</th><th>Antes do aceite</th><th class="txt">Principal motivo</th></tr></thead><tbody>${ls.map(linha).join('')}</tbody></table></div>
    <div id="listaCanc">${linhasCancPrioridade(a)}</div></section>`;
}

const baseOtd = (n) => (n ? `<small>${n === 1 ? '1 entrega' : num(n) + ' entregas'}</small>` : '<small>sem finalizada</small>');
const celulasMod = (l) => (l.mods || []).filter((x) => x.prazo).map((x) => `<div><span>OTD ${esc(x.mod)} · ${prazoTxt(x.mod)}</span><b>${pc(x.otd)}</b>${baseOtd(x.otdN)}</div>`).join('');

function blocoPrioridade(a) {
  const cards = a.prioridade.map((l) => {
    if (l.semPedidos) return `<div class="card"><h3>Loja ${esc(l.num)}${l.bairro ? ' · ' + esc(l.bairro) : ''}</h3>${l.band ? `<div class="sub">${l.band === 'EF' ? 'Extrafarma' : 'Pague Menos'}</div>` : ''}<p class="vazio">Sem pedidos ${neste()}.</p></div>`;
    const motivos = l.motivos.length ? l.motivos.map((m) => `<div class="motivo${m.op ? ' op' : ''}"><div class="tt">${esc(m.motivo)}${m.op ? '<span class="tag">Operacional</span>' : ''}</div><div class="vv">${num(m.n)}${m.c05 ? ` · ${num(m.c05)} em 0 a 5 min` : ''}</div><div class="bar"><i style="width:${(100 * m.n) / l.canc}%"></i></div></div>`).join('') : `<p class="vazio">Nenhum cancelamento ${neste()}.</p>`;
    const lista = l.cancelamentos.length ? `<details data-chave="canc-${esc(l.num)}"><summary>${l.cancelamentos.length === 1 ? 'Ver o cancelamento' : `Ver os ${num(l.cancelamentos.length)} cancelamentos, um a um`}</summary><div class="rolagem"><table><thead><tr><th>Hora</th><th class="txt">Modalidade</th><th>Até cancelar</th><th class="txt">Fase</th><th class="txt">Motivo</th><th>Pedido</th></tr></thead><tbody>${l.cancelamentos.map((c) => `<tr><td class="nw">${esc(horaCanc(c))}</td><td class="txt">${esc(c.mod || '—')}</td><td>${min(c.min)}</td><td class="txt">${esc(c.fase)}</td><td class="txt">${esc(c.motivo)}</td><td>${esc(c.id)}</td></tr>`).join('')}</tbody></table></div></details>` : '';

// Entregadores até 3 km: o botão abre uma linha abaixo da entrega. A consulta só sai com o clique.
const proxAbertos = new Set(), proxDados = {};
const COLUNAS_ENTREGA = 7;
const celProx = (id, p) => `<td class="nw">${p?.whatsapp ? `<small class="zap-conta">WhatsApp ${num(p.whatsapp)}/${num(p.whatsappMax)}</small>` : ''}<button type="button" class="prox-btn" data-pedido="${esc(id)}" aria-expanded="${proxAbertos.has(String(id))}">Até 3 km ${proxAbertos.has(String(id)) ? '▴' : '▾'}</button></td>`;
function htmlTelefone(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
  if (d.length !== 10 && d.length !== 11) return `<span class="tel">${t ? esc(t) : 'sem telefone'}</span>`;
  return `<a class="tel" href="tel:+55${d}">(${d.slice(0, 2)}) ${d.slice(2, -4)}-${d.slice(-4)}</a>`;
}
const telefoneValido = (t) => { let d = String(t || '').replace(/\D/g, ''); if (d.length >= 12 && d.startsWith('55')) d = d.slice(2); return d.length === 10 || d.length === 11; };
const zapEstado = {};
function htmlZap(pedido, d, e) {
  if (!telefoneValido(e.telefone)) return '';
  // Entrega com entregador não recebe oferta: um "Sim" não teria o que atribuir.
  if (!d.buscando) return '<button type="button" class="zap-btn" disabled title="A oferta por WhatsApp só vale para entrega buscando entregador">WhatsApp só em busca</button>';
  if (!d.whatsappAtivo) return '<button type="button" class="zap-btn" disabled title="O painel não conseguiu falar com o Radar agora; tenta de novo sozinho">WhatsApp indisponível</button>';
  const st = zapEstado[pedido + ':' + e.id] || {};
  if (st.ok && st.semConfirmacao) return '<button type="button" class="zap-btn" disabled>Enviado ao GHL · sem confirmação</button>';
  if (e.whatsappEnviado || st.ok) return '<button type="button" class="zap-btn" disabled>✓ WhatsApp enviado</button>';
  if (st.enviando) return '<button type="button" class="zap-btn" disabled>Enviando…</button>';
  return `<button type="button" class="zap-btn" data-pedido="${esc(pedido)}" data-zap="${esc(e.id)}" aria-label="Enviar WhatsApp para ${esc(e.nome)}">WhatsApp</button>`;
}
function corpoProx(id) {
  const d = proxDados[id];
  if (!d) return '<p class="vazio">Buscando entregadores perto da loja…</p>';
  if (d.erro) return `<p class="vazio">${esc(d.erro)}</p>`;
  if (d.semColeta) return '<p class="vazio">A API não informou a localização da loja neste pedido.</p>';
  const hora = new Date(d.em).toLocaleTimeString('pt-BR', { timeZone: 'America/Fortaleza' });
  const livres = d.lista.filter((e) => !e.emEntrega).length, ocupados = d.lista.length - livres;
  const avisos = d.buscando ? '' : 'Esta entrega já tem entregador: o envio por WhatsApp só vale para entrega buscando';
  const topo = `<div class="al-prox-top"><span><b>${num(livres)}</b> ${livres === 1 ? 'disponível' : 'disponíveis'}</span><span><b>${num(ocupados)}</b> com entrega</span><span>até ${num(d.raioKm)} km da loja, em linha reta · leitura das ${hora}</span></div>${avisos ? `<p class="nota" style="margin:0 0 8px">${avisos}</p>` : ''}`;
  if (!d.lista.length) return topo + `<p class="vazio">Nenhum dos ${num(d.online)} entregadores online está a até ${num(d.raioKm)} km desta loja.</p>`;
  return topo + `<div class="al-lista">${d.lista.map((e) => {
    const erro = zapEstado[id + ':' + e.id]?.erro;
    return `<div class="al-ent"><b>${esc(e.nome)}</b><span class="km">${Number(e.km).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km</span><small>ID ${esc(e.id)} · ${esc(e.veiculo)}</small><span class="sit ${e.emEntrega ? 'ocupado' : 'livre'}">${e.emEntrega ? 'com entrega' : 'disponível'}</span><div class="al-acoes">${htmlTelefone(e.telefone)}${htmlZap(id, d, e)}</div>${erro ? `<div class="zap-erro" role="alert">${esc(erro)}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
const linhaProx = (id) => (proxAbertos.has(String(id)) ? `<tr class="prox-linha"><td colspan="${COLUNAS_ENTREGA}"><div class="prox-caixa" id="prox-${esc(id)}">${corpoProx(String(id))}</div></td></tr>` : '');
// Enquanto a entrega estiver buscando e aberta na tela, atualiza quem já recebeu a oferta.
const proxTimers = {};
async function abrirProx(id, novaConsulta = true) {
  clearTimeout(proxTimers[id]);
  if (novaConsulta) delete proxDados[id];
  try {
    const r = await fetch('/api/proximos?pedido=' + encodeURIComponent(id), { cache: 'no-store' });
    proxDados[id] = await r.json();
  } catch { if (novaConsulta) proxDados[id] = { erro: 'Não foi possível ler os entregadores agora. Tente de novo em instantes.' }; }
  if (!proxAbertos.has(String(id))) return;
  const el = document.getElementById('prox-' + id);
  if (el) {
    const rolagem = el.querySelector('.al-lista')?.scrollTop || 0;
    el.innerHTML = corpoProx(id);
    const lista = el.querySelector('.al-lista');
    if (lista) lista.scrollTop = rolagem;
  }
  const d = proxDados[id];
  if (d && !d.erro && d.buscando) proxTimers[id] = setTimeout(() => abrirProx(id, false), 15000);
}

// Evolução: lê /api/evolucao ao abrir e quando muda o dia escolhido; não redesenha a cada leitura ao vivo.
let evol = null, evoVisao = 'dia', evoAte = '', evoBusca = '';
const sinal = (n) => (n > 0 ? '+' : '') + num(n);
function htmlDelta(pct, dif) {
  if (pct == null) return dif > 0 ? '<span class="delta sobe">Sem base anterior</span>' : '<span class="delta igual">Sem base anterior</span>';
  const v = `${pct > 0 ? '+' : ''}${Number(pct).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
  if (Math.abs(pct) < 5) return `<span class="delta igual">${v} · estável</span>`;
  return `<span class="delta ${pct > 0 ? 'sobe' : 'desce'}">${v}</span>`;
}
function linhasEvo(lista) {
  return lista.map((l) => `<tr><td class="loja">${l.num ? esc(l.num) + ' · ' : ''}${esc(l.bairro)}<small>${l.band}</small>${l.prio ? '<span class="star" title="Loja prioritária">★</span>' : ''}</td><td class="forte">${num(l.dem)}</td><td>${num(l.base)}</td><td>${sinal(l.dif)}</td><td>${l.base ? htmlDelta(l.pct, l.dif) : (l.dem ? 'sem pedidos antes' : '—')}</td><td>${pc(l.taxaCanc)}</td></tr>`).join('');
}
const CAB_EVO = '<thead><tr><th>Loja</th><th>Agora</th><th>Antes</th><th>Diferença</th><th>Variação</th><th>% canc.</th></tr></thead>';
function corpoTodasEvo(v) {

function blocoEvolucao() {

  const botoes = [['dia', 'Dia × semana anterior'], ['diaAnterior', 'Dia × dia anterior'], ['semana', 'Semana'], ['mes', 'Mês']].map(([k, t]) => `<button type="button" data-evo="${k}" aria-pressed="${k === evoVisao}">${t}</button>`).join('');
  const tile = (rot, g) => `<div class="evo-tile"><span>${rot}</span><b>${num(g.dem)}</b>${htmlDelta(g.pct, g.dem - g.base)}<small>antes ${num(g.base)} pedidos · canceladas ${pc(g.taxaCanc)} (antes ${pc(g.taxaCancBase)})</small></div>`;
  const max = Math.max(1, ...v.serie.map((p) => p.PM + p.EF));

  const passo = v.serie.length > 16 ? 5 : v.serie.length > 12 ? 2 : 1;
  const eixo = v.serie.map((p, i) => `<span>${(v.serie.length - 1 - i) % passo === 0 ? esc(p.rotulo) : ''}</span>`).join('');
  const c = v.contagem;
  const avisos = [v.baseDe < evol.primeiro || !v.temBase ? 'Sem dados anteriores para comparar neste período.' : '', v.de < '2026-03-01' || v.baseDe < '2026-03-01' ? 'Janeiro e fevereiro vêm dos extratos, porque a API só guarda pedidos a partir de 01/03.' : '', v.serie.some((p) => p.parcial) ? 'A barra mais clara é um período ainda incompleto.' : ''].filter(Boolean).join(' ');

}
const redesenhaEvo = () => { const el = $('#evolucao'); if (el) { const aberto = el.querySelector('details')?.open; el.outerHTML = blocoEvolucao(); if (aberto) $('#evolucao details')?.setAttribute('open', ''); } };

  const maior = Math.max(1, ...linhas.map((l) => l[campo] || 0));

  if (!linhas.length) return `<section><h2>${titulo}</h2><p class="nota">${nota}</p><p class="vazio">${vazio}</p></section>`;
  return `<section><h2>${titulo}</h2><p class="nota">${nota}</p><div class="rolagem"><table><thead><tr><th>Loja</th>${colunas.map((c) => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${linhas.map((l) => `<tr><td class="loja">${nomeLoja(l)}</td>${colunas.map((c, i) => `<td class="${i === 0 ? 'forte' : ''}">${c[1](l)}${i === 0 ? barra(l) : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}

function blocoRankings(a) {

    ${tabela('Maior dificuldade para aceitar', `Parcela de pedidos que passou de 5 min até o aceite ou não foi aceita, em lojas com ${a.minDemandaTaxa} pedidos ou mais. Não conta o que outra transportadora aceitou primeiro.`, [['Dificuldade', (l) => pc(l.dificuldade)], ['Aceite médio', (l) => min(l.aceite)], ['Acima de 5 min', (l) => num(l.acimaDe5)], ['Sem aceite', (l) => num(l.semAceite)]], r.aceite, 'Nenhuma loja com volume suficiente.', 'dificuldade')}
    ${tabela('Maior cancelamento por motivo operacional', 'Falta de entregador e atraso ou problema do entregador, o mesmo "Motivo Bee" do Power BI.', [['Operacional', (l) => num(l.cOp)], ['% da demanda', (l) => pc(l.pctOp)], ['Canceladas', (l) => num(l.canc)], ['Demanda', (l) => num(l.dem)]], r.operacional, 'Nenhum cancelamento operacional.', 'cOp')}
    ${tabela('Mais cancelam de 0 a 5 minutos', 'Cancelamentos em até 5 min depois de criar o pedido.', [['0 a 5 min', (l) => num(l.c05)], ['% dos canc.', (l) => pc(l.pctC05)], ['Canceladas', (l) => num(l.canc)], ['Demanda', (l) => num(l.dem)]], r.ate5, 'Nenhum cancelamento nessa faixa.', 'c05')}

}

function blocoOrientacoes(a) {

}

function blocoMotivos(a) {

  const pend = a.motivosPendentes ? ` ${num(a.motivosPendentes)} ainda sem leitura de motivo.` : '';
  return `<section><h2>Motivos de cancelamento do grupo</h2><p class="nota">Amarelo é operacional; cinza, os demais.${pend}</p>${corpo}</section>`;
}

function blocoLojas(a) {
  const f = busca.trim().toLowerCase();

  const linhas = ls.map((l) => `<tr><td class="loja">${nomeLoja(l)}</td><td class="forte">${num(l.dem)}</td><td>${num(l.fin)}</td><td>${num(l.canc)}</td><td>${pc(l.taxaCanc)}</td><td>${num(l.cOp)}</td><td>${num(l.c05)}</td><td>${min(l.aceite)}</td>${ORDEM_MODS.map((m) => celMod(l, m)).join('')}<td>${pc(l.otd)}</td></tr>`).join('');

function blocoRequisicoes(d) {

}

function regras() {
  return `<section><details><summary>Como cada número é calculado</summary><ul class="regras">
    <li><b>Dia:</b> pedidos criados das 00:00 às 23:59 em Fortaleza. O dia corrente fica parcial até virar o dia.</li>
    <li><b>Período (De/Até):</b> soma os dias gravados no painel no intervalo; taxas e tempos médios são recalculados sobre o total, não a média dos dias. Entregas buscando e em andamento são sempre as de agora. "Hoje" volta para o dia ao vivo.</li>
    <li><b>Atualização:</b> buscando a cada minuto; indicadores a cada 5 min, só das lojas do grupo; às 04:00 uma conferência relê ontem na franquia inteira e inclui loja nova.</li>
    <li><b>Modalidade:</b> vem do prazo do pedido, como no Radar: Super Expressa (30 min), Expressa (60 min) e Econômica (24 h no pedido). O prazo do OTD é 30 min, 60 min e 2 h. Sem prazo, é Agendada (com horário marcado) ou Padrão, e fica fora do OTD.</li>
    <li><b>OTD:</b> finalizada que chegou ao cliente dentro do prazo da sua modalidade, contado da criação do pedido. O OTD geral junta as modalidades, cada entrega contra o próprio prazo.</li>
    <li><b>Tempo das pontas:</b> média da criação à chegada na loja e da saída da loja à chegada no cliente, nas finalizadas com os dois tempos.</li>
    <li><b>Aceite:</b> do início da busca ao aceite, nos pedidos aceitos, finalizados ou não. Pedido de integração que já nasce com entregador não passa por busca e fica de fora ("sem busca").</li>
    <li><b>Em andamento:</b> entregas abertas nas lojas prioritárias, com o status que a API informa. Tempo é o da etapa atual, a partir do último carimbo da entrega.</li>
    <li><b>Evolução:</b> pedidos criados em dias fechados, por loja e por bandeira. Dia contra o mesmo dia da semana anterior ou contra o dia anterior; semana de segunda a domingo; mês até o dia escolhido contra o mesmo intervalo do mês anterior. Estável é variação menor que 5%.</li>
    <li><b>Até 3 km:</b> entregadores online a até 3 km da coleta da entrega, em linha reta, com ID, nome completo, telefone e WhatsApp. O WhatsApp só aparece em entrega buscando e é enviado pelo Radar, com os mesmos limites e a mesma resposta Sim.</li>
    <li><b>Alerta sonoro:</b> toca quando uma entrega das lojas prioritárias aparece buscando e repete a cada minuto até ter entregador.</li>
    <li><b>Entregadores:</b> entregas finalizadas por loja, pela data de criação do pedido.</li>
    <li><b>Operacional:</b> motivo classificado como falta de entregador ou atraso/problema do entregador.</li>
    <li><b>Selos de OTD:</b> Bom de 85% para cima, Atenção de 70% a 85%, Crítico abaixo de 70%.</li>
  </ul></details></section>`;
}

    if (dados.atual) a.push(`<div class="aviso"><b>Ao vivo, hoje ${dataBr(dados.atual.dia)}</b>, das 00:00 até a leitura de ${quando(dados.atual.lido_em)}. Indicadores a cada ${num(dados.kpiMinutos)} min; entregas buscando e em andamento a cada minuto. O acumulado fica em <b>Dados gerais</b>.</div>`);

  }
  $('#avisos').innerHTML = a.join('');
}

      <div class="rk-t canc"><span class="l">Canceladas</span><span class="v">${num(k.canc)}</span><span class="f">${pc(k.taxaCanc)} de cancelamento · ${num(k.cOp)} operacionais</span></div>

    <div class="rk">
      <div class="rk-t otd ${corOtd}"><span class="l">OTD geral · no prazo da modalidade</span><span class="v">${pc(k.otd)}</span><span class="f">${k.otdN ? `${num(k.otdN)} entregas · ` : ''}${corOtd ? chipOtd(k.otd) : 'sem entregas'}</span></div>
      <div class="rk-t ac"><span class="l">Aceite médio</span><span class="v">${min(k.aceite)}</span><span class="f">${pc(k.pctAte5)} em até 5 min${k.direto ? ` · ${num(k.direto)} sem busca` : ''}</span></div>
      <div class="rk-t p1"><span class="l">Ponta 1 · até a loja</span><span class="v">${min(k.p1Med)}</span><span class="f">da criação à chegada na loja</span></div>
      <div class="rk-t p2"><span class="l">Ponta 2 · loja ao cliente</span><span class="v">${min(k.p2Med)}</span><span class="f">da saída à chegada no cliente</span></div>
    </div>

function desenharGerais() {

async function carregar() {
  dados = await (await fetch('/api/dados', { cache: 'no-store' })).json();
  if (!periodo.de && dados.atual) aplicarPreset(presetAtivo || 'mes', false);
  desenhar();
  if (aba === 'gerais') carregarPeriodo();
  if (aba === 'lojas') carregarLojas();
  if (aba === 'canc') carregarCanc();
  if (aba === 'visitas') carregarVisitas();
  setTimeout(() => document.body.classList.add('sem-entrada'), 700);
}
let periodoEmVoo = false;
async function carregarPeriodo() {
  if (periodoEmVoo) return;
  periodoEmVoo = true;
  try {
    dadosP = await (await fetch('/api/dados?' + new URLSearchParams({ de: periodo.de, ate: periodo.ate }), { cache: 'no-store' })).json();
    avisos(); desenharFiltro(); desenharGerais();

// Alerta sonoro. O navegador só libera áudio depois de um clique na página; até lá o botão pede ativação.
const TITULO = document.title;
const btnSom = $('#som');
let somLigado = true, audio = null, ultimaLeituraAlerta = null;
try { somLigado = localStorage.getItem('pm-som') !== 'desligado'; } catch {}

function mostrarSom() {
  const ativo = somLigado && audio?.state === 'running';
  btnSom.className = 'som ' + (ativo ? 'on' : somLigado ? 'pede' : '');
  btnSom.setAttribute('aria-pressed', String(ativo));
  btnSom.lastElementChild.textContent = ativo ? 'Som ligado' : somLigado ? 'Ativar som' : 'Som desligado';
}
async function prepararAudio() {
  audio ||= new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') await audio.resume();
}
function bip() {
  const t0 = audio.currentTime;
  [[880, 0], [660, 0.2], [880, 0.4]].forEach(([freq, ini]) => {
    const osc = audio.createOscillator(), vol = audio.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    vol.gain.setValueAtTime(0.0001, t0 + ini);
    vol.gain.exponentialRampToValueAtTime(0.25, t0 + ini + 0.02);
    vol.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + 0.17);
    osc.connect(vol).connect(audio.destination);
    osc.start(t0 + ini);
    osc.stop(t0 + ini + 0.18);
  });
}
btnSom.addEventListener('click', async () => {
  const ativo = somLigado && audio?.state === 'running';
  somLigado = !ativo;
  try { localStorage.setItem('pm-som', somLigado ? 'ligado' : 'desligado'); } catch {}
  if (somLigado) { await prepararAudio(); bip(); }
  mostrarSom();
});
// Qualquer clique na página já libera o som, se ele estiver ligado
document.addEventListener('pointerdown', (e) => {
  if (somLigado && !audio && !e.target.closest('#som')) prepararAudio().then(mostrarSom);
});
// Toca a cada leitura (uma por minuto) enquanto houver entrega sem entregador; o título da aba mostra quantas são.
function conferirAlerta() {
  const lista = busc?.lista || [];
  document.title = lista.length ? `(${lista.length}) ${TITULO}` : TITULO;
  if (!lista.length || busc.em === ultimaLeituraAlerta) return;
  ultimaLeituraAlerta = busc.em;
  if (somLigado && audio?.state === 'running') bip();
}
mostrarSom();

async function carregarBuscando() {

  const el = $('#buscando');
  if (el) el.outerHTML = blocoBuscando();
  const elA = $('#andamento');
  if (elA) elA.outerHTML = blocoAndamento();

}

// De/Até: a data invertida é trocada; um só dia igual ao mais recente volta para o ao vivo.
// Período dos Dados gerais e da Análise de lojas: atalhos ou De/Até. Começa em "Este mês".
const hojeFort = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Fortaleza' });
const somaDia = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 86400e3).toISOString().slice(0, 10);
function aplicarPreset(p, recarregar = true) {
  const t = hojeFort();
  const fimMes = (d) => somaDia(somaDia(d.slice(0, 8) + '01', 32).slice(0, 8) + '01', -1);
  const faixas = { hoje: [t, t], ontem: [somaDia(t, -1), somaDia(t, -1)], 7: [somaDia(t, -6), t], 30: [somaDia(t, -29), t], mes: [t.slice(0, 8) + '01', t] };
  const iniAnt = somaDia(t.slice(0, 8) + '01', -1).slice(0, 8) + '01';
  faixas.mesAnt = [iniAnt, fimMes(iniAnt)];
  faixas.ano = [t.slice(0, 5) + '01-01', t];
  if (!faixas[p]) return;
  presetAtivo = p;
  periodo = { de: faixas[p][0], ate: faixas[p][1] };
  if (recarregar) recarregarPeriodo();
}
function recarregarPeriodo() {
  desenharFiltro();
  if (aba === 'gerais') carregarPeriodo();
  if (aba === 'lojas') carregarLojas();
  if (aba === 'canc') carregarCanc();
  if (aba === 'visitas') carregarVisitas();
}
function mudarPeriodo() {
  let de = $('#de').value, ate = $('#ate').value;
  if (!de && !ate) return;
  de ||= ate; ate ||= de;
  if (de > ate) [de, ate] = [ate, de];
  presetAtivo = '';
  periodo = { de, ate };
  recarregarPeriodo();
}
function desenharFiltro() {
  const f = $('#filtroPeriodo');
  f.hidden = aba === 'vivo';
  if (f.hidden) return;
  const dias = dados?.dias || [];
  const primeiro = dias[dias.length - 1]?.dia || '', ultimo = dias[0]?.dia || '';
  for (const el of [$('#de'), $('#ate')]) { el.min = primeiro; el.max = ultimo; }
  if (document.activeElement !== $('#de') && document.activeElement !== $('#ate')) { $('#de').value = periodo.de; $('#ate').value = periodo.ate; }
  for (const b of f.querySelectorAll('[data-p]')) b.setAttribute('aria-pressed', String(b.dataset.p === presetAtivo));
  const n = dias.filter((x) => x.dia >= periodo.de && x.dia <= periodo.ate).length;
  const total = periodo.de && periodo.ate ? Math.round((Date.parse(periodo.ate) - Date.parse(periodo.de)) / 86400e3) + 1 : 0;
  $('#fpResumo').innerHTML = periodo.de ? `<b>${periodo.de === periodo.ate ? dataBr(periodo.de) : `${dataBr(periodo.de)} a ${dataBr(periodo.ate)}`}</b>${num(n)} de ${num(total)} ${total === 1 ? 'dia' : 'dias'} com dados${periodo.ate >= hojeFort() ? ' · hoje ao vivo' : ''} · histórico desde ${primeiro ? dataBr(primeiro) : '—'}` : '';
}
$('#de').addEventListener('change', mudarPeriodo);
$('#ate').addEventListener('change', mudarPeriodo);
for (const b of document.querySelectorAll('#filtroPeriodo [data-p]')) b.addEventListener('click', () => aplicarPreset(b.dataset.p));

const redesenhaProx = (id) => { const el = document.getElementById('prox-' + id); if (el) el.innerHTML = corpoProx(id); };
function abrirZap(pedido, ent) {
  const x = (busc?.lista || []).find((p) => String(p.id) === String(pedido)) || {};

  } catch { zapEstado[k] = { erro: 'Sem conexão com o painel. Confira no GHL antes de tentar de novo.' }; }

// Tudo vem de /api/lojas, calculado pedido a pedido só com a loja escolhida (ou o grupo inteiro) no período De/Até.
// Visão da Análise de lojas: Bee (prazo da operação: 30, 60 e 120 min) ou cliente (60, 120 e 240 min).
let visaoLojas = 'bee';
try { if (localStorage.getItem('pm-visao') === 'cliente') visaoLojas = 'cliente'; } catch {}
let aba = { '#lojas': 'lojas', '#gerais': 'gerais', '#cancelamentos': 'canc', '#visitas': 'visitas' }[location.hash] || 'vivo', lojaSel = '', lojasDados = null, lojasEmVoo = false;
try { lojaSel = localStorage.getItem('pm-loja') || ''; } catch {}
const base = (n, txt = 'entregas') => (n ? `${num(n)} ${n === 1 ? txt.replace(/s$/, '') : txt}` : 'sem base');
// na visão cliente (Super Expressa em 60 min) os prazos ficam em minutos, como foram definidos
const prazoMod = (m, prazos) => (prazos[m] ? (prazos[m] >= 120 && prazos['Super Expressa'] !== 60 ? prazos[m] / 60 + ' h' : prazos[m] + ' min') : 'sem prazo');

function mostrarAba() {
  for (const b of document.querySelectorAll('.abas button')) b.setAttribute('aria-selected', String(b.dataset.aba === aba));
  $('#conteudo').hidden = aba !== 'vivo';
  $('#gerais').hidden = aba !== 'gerais';
  $('#analise').hidden = aba !== 'lojas';
  $('#cancel').hidden = aba !== 'canc';
  $('#visitas').hidden = aba !== 'visitas';
  avisos();
  desenharFiltro();
  if (aba === 'gerais') { if (dadosP) desenharGerais(); if (dados) carregarPeriodo(); }
  else if (aba === 'lojas') { if (dados) carregarLojas(); }
  else if (aba === 'canc') { if (cancDados) desenharCanc(); if (dados) carregarCanc(); }
  else if (aba === 'visitas') { if (visDados) desenharVisitas(); if (dados) carregarVisitas(); }
  else montarGraficos();
}

async function carregarLojas() {
  if (lojasEmVoo) return;
  lojasEmVoo = true;
  try {
    const qs = new URLSearchParams({ de: periodo.de, ate: periodo.ate, loja: lojaSel, visao: visaoLojas });
    lojasDados = await (await fetch('/api/lojas?' + qs, { cache: 'no-store' })).json();
    desenharLojas();
  } catch (e) {
    $('#analise').innerHTML = `<section><p class="vazio">Não foi possível carregar a análise (${esc(e.message)}).</p></section>`;
  } finally { lojasEmVoo = false; }
}

  return `<div class="rolagem"><table><thead><tr><th>Distância</th><th>Pedidos</th><th>Finalizadas</th><th>Canceladas</th>${comMod ? '<th>OTD</th>' : '<th>OTD geral</th>'}<th>Tempo total</th><th>Até a loja</th><th>Loja ao cliente</th></tr></thead><tbody>${fs.map((f) => `<tr><td class="loja">${esc(f.faixa)}</td><td class="forte">${num(f.dem)}</td><td>${num(f.fin)}</td><td>${num(f.canc)}<small class="b">${pc(f.taxaCanc)}</small></td><td>${f.otdN ? `${pc(f.otd)}<small class="b">${num(f.noPrazo)} de ${num(f.otdN)}</small>` : '—'}</td><td>${min(f.total)}</td><td>${min(f.p1)}</td><td>${min(f.p2)}</td></tr>`).join('')}</tbody></table></div>`;
}

function desenharLojas() {
  const j = lojasDados, a = j?.analise;
  if (!a) { $('#analise').innerHTML = '<section><p class="vazio">Ainda não há dados coletados.</p></section>'; return; }
  const g = a.geral, c = a.cancelamentos, pz = a.prazos;

  if (lojaSel && !a.loja) avisos.push('<div class="aviso">A loja escolhida não teve pedido nesse período; mostrando o grupo inteiro.</div>');

  const cliente = a.visao === 'cliente';
  const filtro = `<section class="filtro-lojas${cliente ? ' visao-cliente' : ''}"><div class="topo-sec"><h2>Análise de lojas</h2><span class="sub">${faixaTxt}${a.fechado ? '' : ' · inclui hoje, ao vivo'} · período na barra acima</span></div>
    <div class="visao-linha"><span class="fp-rot">Visão do prazo</span><div class="evo-seg visao" role="group" aria-label="Visão do prazo">

    <label class="per" for="selLoja">Loja<select id="selLoja"><option value="">Análise geral · todas as lojas (${num(a.lojas.length)})</option><optgroup label="Lojas prioritárias">${grupoOpcoes(true)}</optgroup><optgroup label="Demais lojas, da maior demanda para a menor">${grupoOpcoes(false)}</optgroup></select></label></section>`;

  const kpis = `<section><h2>${titulo}</h2><p class="nota">Todos os números abaixo são só ${a.loja ? 'desta loja' : 'do grupo'} em ${faixaTxt}, contados pedido a pedido.</p>
    <div class="kpis">

      ${kpiA('Finalizadas', num(g.fin), 'dos pedidos', g.taxaFin, 'neutro')}
      ${kpiA('Canceladas', num(g.canc), `${pc(g.taxaCanc)} dos pedidos · ${num(c.op)} operacionais`, g.taxaCanc, 'neutro')}
      ${kpiA('OTD geral', pc(g.otd), g.otdN ? `${num(g.noPrazo)} de ${num(g.otdN)} no prazo da modalidade` : 'sem entrega com prazo', g.otd, classeOtd(g.otd), chipOtd(g.otd))}
      ${kpiA('Aceite médio', min(g.aceite), `${pc(g.ate5)} em até 5 min${g.semBusca ? ` · ${num(g.semBusca)} sem busca` : ''}`, g.ate5, 'neutro')}

    </div></section>`;

  // Tempo de atendimento por ponta: uma barra por modalidade, partes em escala comum; a marca é o prazo.
  const linhaPontas = (rot, sub, x, prazo) => ({
    rot, sub, prazo,

  const comPrazo = a.modalidades.filter((m) => m.prazo);

  const barrasAceite = hbarras(a.modalidades.filter((m) => m.aceiteN).map((m) => ({ rot: m.mod, val: m.aceite, cor: COR[m.mod] || COR.Agendada, extra: ` <small>${pc(m.ate5)} até 5 min</small>`, tip: `<b>${esc(m.mod)}</b><br>Aceite médio ${min(m.aceite)}<br>${base(m.aceiteN, 'pedidos com busca')}${m.semBusca ? ` · ${num(m.semBusca)} sem busca` : ''}` })), { max: Math.max(1, ...a.modalidades.map((m) => m.aceite || 0)), fmt: min });
  const linhasMod = a.modalidades.map((m) => `<tr><td class="loja"><i class="ch" style="background:${COR[m.mod] || COR.Agendada}"></i>${esc(m.mod)}<small>${prazoMod(m.mod, pz)}</small></td><td class="forte">${num(m.dem)}</td><td>${num(m.fin)}</td><td>${num(m.canc)}<small class="b">${pc(m.taxaCanc)}</small></td><td>${m.prazo ? (m.otdN ? `${pc(m.otd)}<small class="b">${num(m.noPrazo)} de ${num(m.otdN)}</small>` : '—') : 'fora do OTD'}</td><td>${min(m.aceite)}</td><td>${min(m.p1)}</td><td>${min(m.espera)}</td><td>${min(m.p2)}</td><td>${min(m.total)}</td><td>${kmTxt(m.km)}</td></tr>`).join('');
  const comparacao = `<section><h2>Comparação entre modalidades</h2><p class="nota">OTD: finalizada que chegou ao cliente dentro do prazo da modalidade, contado da criação. Aceite: dos pedidos que passaram por busca.</p>
    <div class="duo"><div><h3 class="sub-h">OTD no prazo da modalidade</h3>${barrasOtd}<p class="nota pe">A marca em 85% é o início da faixa Bom.</p></div><div><h3 class="sub-h">Tempo médio de aceite</h3>${barrasAceite}</div></div>
    <details data-chave="tabela-mod"><summary>Ver a tabela das modalidades</summary><div class="rolagem"><table><thead><tr><th>Modalidade</th><th>Pedidos</th><th>Finalizadas</th><th>Canceladas</th><th>OTD</th><th>Aceite</th><th>Até a loja</th><th>Espera</th><th>Loja ao cliente</th><th>Total</th><th>Km médio</th></tr></thead><tbody>${linhasMod || '<tr><td colspan="11" class="vazio">Sem pedidos.</td></tr>'}</tbody></table></div></details></section>`;

  // Faixas de 2 km: pedidos (volume) e OTD em dois gráficos, nunca no mesmo eixo.
  const grafFaixas = (fs, cor, titulo) => {

    return `<div class="duo"><div><h3 class="sub-h">Pedidos por faixa (km)</h3>${graf({ tipo: 'colunas', titulo: titulo + ': pedidos por faixa', altura: 260, cats, rotulos: true, series: [{ nome: 'Pedidos', cor: COR.volume, vals: ls.map((f) => f.dem) }], tip: dicaF })}</div>
