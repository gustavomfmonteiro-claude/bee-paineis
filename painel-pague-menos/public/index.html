  };
  const blocos = comPrazo.map((m) => `<section class="modsec"><div class="topo-sec"><h2><i class="ch" style="background:${COR[m.mod]}"></i>${esc(m.mod)} <small class="selo">prazo de ${prazoMod(m.mod, pz)}</small></h2>${chipOtd(m.otd)}</div>

    </div>

    <details data-chave="faixas-${esc(m.mod)}"><summary>Ver a tabela de faixas</summary>${tabelaFaixas(m.faixas, true)}</details></section>`).join('');
  const semPrazo = a.modalidades.filter((m) => !m.prazo);
  const notaSemPrazo = semPrazo.length ? ` ${semPrazo.map((m) => `${esc(m.mod)}: ${num(m.dem)} pedidos`).join(' · ')}, sem prazo, fora do OTD.` : '';
  const faixasGeral = `<section><h2>Entregas por distância · todas as modalidades</h2><p class="nota">Faixas de ${num(a.faixaKm)} km pela distância do pedido (0 a 2 km; 3 a 4 km = acima de 2 até 4 km). OTD de cada entrega contra o prazo da sua modalidade. Gráficos até 20 km; a tabela tem todas as faixas.${notaSemPrazo}</p>
    ${grafFaixas(g.faixas, COR.geral, 'Todas as modalidades')}
    <details data-chave="faixas-geral"><summary>Ver a tabela de faixas</summary>${tabelaFaixas(g.faixas, false)}</details></section>`;

  const fases = c.fases.map((f, i) => ({ nome: f.fase, val: f.n, cor: COR.fase[Math.min(i, 2)], claro: i === 0 }));
  const ordemFase = ['Antes do aceite', 'Entregador a caminho ou na loja', 'Já em rota'];
  fases.sort((x, y) => ordemFase.indexOf(x.nome) - ordemFase.indexOf(y.nome)).forEach((f, i) => { f.cor = COR.fase[i] || COR.fase[2]; f.claro = i === 0; });
  const maxMot = Math.max(1, ...c.motivos.map((m) => m.n));
  const topMotivos = hbarras(c.motivos.slice(0, 10).map((m) => ({ rot: m.motivo, sub: m.op ? 'operacional' : m.grupo, val: m.n, cor: m.op ? COR.op : COR.naoOp, extra: ` <small>${pc(m.pct)}</small>`, tip: `<b>${esc(m.motivo)}</b><br>${m.op ? 'Operacional' : esc(m.grupo)}<br>${num(m.n)} cancelamentos · ${pc(m.pct)}<br>${num(m.c5)} com menos de ${num(a.minBusca)} min de busca` })), { max: maxMot, fmt: num, largo: true });
  const porMod = hpilhas(c.porModalidade.filter((m) => m.canc).map((m) => ({ rot: m.mod, sub: `${pc(m.taxa)} dos pedidos`, partes: [{ nome: 'Operacional', val: m.op, cor: COR.op }, { nome: 'Não operacional', val: m.naoOp, cor: COR.naoOp }], valor: `${num(m.canc)}<small>${num(m.c5)} &lt;${num(a.minBusca)} min</small>`, tip: `<b>${esc(m.mod)}</b><br>${num(m.canc)} canceladas · ${pc(m.taxa)} dos pedidos<br>Operacional ${num(m.op)} · não operacional ${num(m.naoOp)}<br>${num(m.c5)} com menos de ${num(a.minBusca)} min de busca` })), { fmt: num });
  const cancelamentos = `<section><h2>Cancelamentos</h2><p class="nota">Operacional: falta de entregador ou atraso/problema do entregador. "Menos de ${num(a.minBusca)} min de busca": cancelado antes de completar ${num(a.minBusca)} min desde o início da busca (sem busca, conta da criação).${c.pendentes ? ` ${num(c.pendentes)} ainda sem leitura de motivo.` : ''}</p>
    <div class="kpis q4">
      ${kpiA('Cancelados', num(c.total), `${pc(c.taxa)} dos pedidos`, c.taxa, 'neutro')}
      ${kpiA('Operacionais', num(c.op), 'falta ou problema do entregador', c.pctOp, 'neutro')}
      ${kpiA('Não operacionais', num(c.naoOp), 'loja, cliente, outra transportadora', c.total ? Math.round(1000 - 10 * c.pctOp) / 10 : null, 'neutro')}
      ${kpiA(`Menos de ${num(a.minBusca)} min de busca`, num(c.c5), 'dos cancelamentos', c.pctC5, 'neutro')}
    </div>
    <div class="duo">
      <div><h3 class="sub-h">Operacional × não operacional</h3>${segmentos([{ nome: 'Operacional', val: c.op, cor: COR.op, claro: true }, { nome: 'Não operacional', val: c.naoOp, cor: COR.naoOp }])}
        <h3 class="sub-h">Tempo de busca até cancelar</h3>${segmentos([{ nome: `Menos de ${num(a.minBusca)} min`, val: c.c5, cor: COR.p2 }, { nome: `${num(a.minBusca)} min ou mais`, val: c.total - c.c5 - c.semMinBusca, cor: COR.naoOp }, ...(c.semMinBusca ? [{ nome: 'Sem horário', val: c.semMinBusca, cor: '#3A4350' }] : [])])}
        <h3 class="sub-h">Em que fase cancelou</h3>${segmentos(fases)}</div>
      <div><h3 class="sub-h">Por modalidade</h3>${legenda([{ nome: 'Operacional', cor: COR.op }, { nome: 'Não operacional', cor: COR.naoOp }])}${porMod || '<p class="vazio">Nenhum cancelamento.</p>'}</div>
    </div>
    <h3 class="sub-h">Principais motivos, como foram registrados</h3>${c.motivos.length ? legenda([{ nome: 'Operacional', cor: COR.op }, { nome: 'Não operacional', cor: COR.naoOp }]) + topMotivos : '<p class="vazio">Nenhum cancelamento.</p>'}
    ${c.motivos.length > 10 ? `<details data-chave="motivos-todos"><summary>Ver os ${num(c.motivos.length)} motivos</summary><div class="rolagem"><table><thead><tr><th class="txt">Motivo</th><th class="txt">Tipo</th><th>Qtde</th><th>%</th><th>Menos de ${num(a.minBusca)} min de busca</th></tr></thead><tbody>${c.motivos.map((m) => `<tr><td class="txt">${esc(m.motivo)}</td><td class="txt">${m.op ? '<span class="tag" style="margin:0">Operacional</span>' : esc(m.grupo)}</td><td class="forte">${num(m.n)}</td><td>${pc(m.pct)}</td><td>${num(m.c5)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    ${c.lista.length ? `<details data-chave="lista-canc-lojas"${a.loja ? ' open' : ''}><summary>${c.listaCortada ? `Ver os ${num(c.lista.length)} mais recentes de ${num(c.total)} cancelamentos` : `Ver os ${num(c.lista.length)} cancelamentos, um a um`}</summary><div class="rolagem"><table><thead><tr><th>Data</th><th>Hora</th>${a.loja ? '' : '<th class="txt">Loja</th>'}<th class="txt">Modalidade</th><th>Min de busca</th><th>Min desde a criação</th><th class="txt">Fase</th><th class="txt">Motivo</th><th class="txt">Tipo</th><th>Pedido</th></tr></thead><tbody>${c.lista.map((x) => `<tr><td>${dataBr(x.dia).slice(0, 5)}</td><td class="forte">${esc(x.h)}</td>${a.loja ? '' : `<td class="txt">${esc(x.loja)} · ${esc(x.bairro)}</td>`}<td class="txt">${esc(x.mod || '—')}</td><td${x.minBusca != null && x.minBusca < a.minBusca ? ' class="quente"' : ''}>${min(x.minBusca)}</td><td>${min(x.minCriacao)}</td><td class="txt">${esc(x.fase)}</td><td class="txt">${esc(x.motivo)}</td><td class="txt">${x.op ? '<span class="tag" style="margin:0">Operacional</span>' : 'Não operacional'}</td><td>${esc(x.id)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
  </section>`;

  const regrasLojas = `<section><details><summary>Como cada número desta aba é calculado</summary><ul class="regras">
    <li><b>Base:</b> cada pedido do período, gravado um a um na leitura da API (loja, modalidade, horários e distância; sem cliente nem endereço). Escolhida uma loja, entram só os pedidos dela.</li>
    <li><b>Modalidade:</b> pelo prazo do pedido, como no Radar. Prazo do OTD na visão Bee: Super Expressa 30 min, Expressa 60 min, Econômica 2 h. Na visão cliente: 60 min, 120 min e 240 min. O botão no topo da aba troca a visão.</li>
    <li><b>OTD:</b> finalizada com chegada ao cliente até o prazo, contada da criação. Base: finalizadas com o carimbo de chegada.</li>
    <li><b>Pontas:</b> ponta 1 da criação à chegada na loja; espera da chegada à saída da loja; ponta 2 da saída à chegada no cliente. Médias das finalizadas que têm cada carimbo; tempo acima de 8 h é descartado como carimbo errado.</li>
    <li><b>Aceite:</b> do início da busca ao aceite. Pedido de integração que já nasce com entregador não passa por busca e fica de fora ("sem busca").</li>
    <li><b>Distância:</b> a do pedido (campo distance da API), em faixas de 2 km: 0 a 2, 3 a 4 (acima de 2 até 4), 5 a 6 e assim por diante.</li>
    <li><b>Cancelamento com menos de 5 min de busca:</b> do início da busca (ou da criação, sem busca) até o cancelamento.</li>
    <li><b>Gráficos:</b> passe o mouse (ou toque) numa barra, coluna ou ponto para ver os números; a marca de 85% é o início da faixa Bom do OTD.</li>
  </ul></details></section>`;

  const abertos = [...document.querySelectorAll('#analise details[open][data-chave]')].map((x) => x.dataset.chave);
  $('#analise').innerHTML = avisos.join('') + filtro + kpis + pontas + comparacao + `<div class="modgrid">${blocos}</div>` + faixasGeral + cancelamentos + regrasLojas;
  for (const k of abertos) document.querySelector(`#analise details[data-chave="${k}"]`)?.setAttribute('open', '');
  montarGraficos();
  for (const b of document.querySelectorAll('#analise [data-visao]')) b.addEventListener('click', () => {
    if (visaoLojas === b.dataset.visao) return;
    visaoLojas = b.dataset.visao;
    try { localStorage.setItem('pm-visao', visaoLojas); } catch {}
    carregarLojas();
  });
  $('#selLoja').addEventListener('change', (e) => {
    lojaSel = e.target.value;
    try { localStorage.setItem('pm-loja', lojaSel); } catch {}
    carregarLojas();
  });
}

for (const b of document.querySelectorAll('.abas button')) b.addEventListener('click', () => {
  aba = b.dataset.aba;
  history.replaceState(null, '', aba === 'vivo' ? location.pathname : '#' + (aba === 'canc' ? 'cancelamentos' : aba));
  mostrarAba();
});

// ------------------------------------------------------------ aba Cancelamentos
// /api/cancelamentos: a loja escolhida (ou o grupo) no período, sempre com a referência do grupo ao lado.
let cancDados = null, cancEmVoo = false;
async function carregarCanc() {
  if (cancEmVoo) return;
  cancEmVoo = true;
  try {
    const qs = new URLSearchParams({ de: periodo.de, ate: periodo.ate, loja: lojaSel });
    cancDados = await (await fetch('/api/cancelamentos?' + qs, { cache: 'no-store' })).json();
    desenharCanc();
  } catch (e) {
    $('#cancel').innerHTML = `<section><p class="vazio">Não foi possível carregar os cancelamentos (${esc(e.message)}).</p></section>`;
  } finally { cancEmVoo = false; }
}

function desenharCanc() {
  const j = cancDados, a = j?.analise;
  if (!a) { $('#cancel').innerHTML = '<section><p class="vazio">Ainda não há dados coletados.</p></section>'; return; }
  const r = a.resumo, g = a.grupo, mb = num(a.minBusca);
  const faixaTxt = a.de === a.ate ? dataBr(a.de) : `${dataBr(a.de)} a ${dataBr(a.ate)}`;
  const daLoja = !!a.loja;
  const refG = (v) => (daLoja ? ` · grupo ${pc(v)}` : '');
  const titulo = daLoja ? `Loja ${esc(a.loja.num)} · ${esc(a.loja.bairro)} <small class="selo">${a.loja.band === 'EF' ? 'Extrafarma' : 'Pague Menos'}</small>` : 'Grupo inteiro · Pague Menos + Extrafarma';
  const opcoes = (prio) => a.lojas.filter((l) => l.prio === prio).map((l) => `<option value="${l.id}"${l.id === lojaSel ? ' selected' : ''}>${esc(l.num || '—')} · ${esc(l.bairro)} (${l.band}) · ${num(l.canc)} canc. de ${num(l.dem)}</option>`).join('');

  const filtro = `<section class="filtro-lojas"><div class="topo-sec"><h2>Cancelamentos</h2><span class="sub">${faixaTxt}${a.fechado ? '' : ' · inclui hoje, ao vivo'} · período na barra acima</span></div>
    <label class="per" for="selLojaCanc">Loja<select id="selLojaCanc"><option value="">Análise geral · todas as lojas (${num(a.lojas.length)})</option><optgroup label="Lojas prioritárias">${opcoes(true)}</optgroup><optgroup label="Demais lojas, das que mais cancelam para as que menos cancelam">${opcoes(false)}</optgroup></select></label></section>`;

  const kpis = `<section><h2>${titulo}</h2><p class="nota">${daLoja ? 'Números só desta loja; ao lado, a referência do grupo no mesmo período.' : 'Grupo inteiro no período. Escolha uma loja para ver os problemas da unidade.'}</p>
    <div class="kpis">
      ${kpiA('Cancelados', num(r.canc), `de ${num(r.dem)} pedidos${refG(g.taxa)}`, r.taxa, 'canc', '', { v: pc(r.taxa), rot: 'dos pedidos', cor: 'mau' })}
      ${kpiA('Operacionais', num(r.op), `falta ou problema do entregador${refG(g.pctOp)}`, r.pctOp, 'neutro', '', { v: pc(r.pctOp), rot: 'dos cancelamentos', cor: 'azul' })}
      ${kpiA(`Menos de ${mb} min de busca`, num(r.c5), `cancelaram cedo${refG(g.pctC5)}`, r.pctC5, 'neutro', '', { v: pc(r.pctC5), rot: 'dos cancelamentos', cor: 'azul' })}
      ${kpiA('Antes do aceite', num(r.antesAceite), `nem chegaram a ter entregador${refG(g.pctAntes)}`, r.pctAntes, 'neutro', '', { v: pc(r.pctAntes), rot: 'dos cancelamentos', cor: 'azul' })}
      <div class="kpi"><span class="rot">Tempo até cancelar</span><b>${min(r.medianaBusca)}</b><span class="pct">${min(r.mediaBusca)}<em>em média</em></span><small>mediana, do início da busca${daLoja ? ` · grupo ${min(g.medianaBusca)}` : ''}</small></div>
      <div class="kpi"><span class="rot">Não operacionais</span><b>${num(r.naoOp)}</b><span class="pct">${pc(r.canc ? Math.round(1000 - 10 * r.pctOp) / 10 : null)}<em>dos cancelamentos</em></span><small>loja, cliente, outra transportadora, cadastro</small></div>
    </div></section>`;

  const atencao = `<section><h2>Pontos de atenção</h2><p class="nota">Gerados pelas regras a partir dos números ${daLoja ? 'da loja, comparados com o grupo' : 'do grupo'}. Apontam onde olhar; a causa de cada caso precisa ser confirmada com a loja e a operação.</p>
    ${a.atencao.length ? `<div class="oris">${a.atencao.map((x) => `<div class="ori"><span class="chip ${x.nivel === 'alta' ? 'mau' : 'med'}">${x.nivel === 'alta' ? 'Alta' : 'Média'}</span><h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p></div>`).join('')}</div>` : '<p class="vazio">Nenhum número fora do padrão neste período.</p>'}</section>`;

  // minuto a minuto: operacional (amarelo) × não operacional (cinza), empilhado; a dica traz o acumulado
  const cm = a.minutos.map((x) => x.faixa);
  const grafMin = graf({ tipo: 'colunas', titulo: 'Cancelamentos por minuto de busca', altura: 280, cats: cm, empilhado: true,
    series: [{ nome: 'Operacional', cor: COR.op, vals: a.minutos.map((x) => x.op) }, { nome: 'Não operacional', cor: COR.naoOp, vals: a.minutos.map((x) => x.naoOp) }],
    tip: (i) => { const x = a.minutos[i]; return `<b>${esc(x.faixa)} min de busca</b><br>${num(x.n)} cancelamentos<br><i class="ch" style="background:${COR.op}"></i>Operacional ${num(x.op)}<br><i class="ch" style="background:${COR.naoOp}"></i>Não operacional ${num(x.naoOp)}<br>Até aqui: ${pc(x.acumulado)} dos cancelamentos`; } });
  const ate = (n) => a.minutos.slice(0, n).reduce((t, x) => t + x.n, 0);
  const totMin = r.canc ? a.minutos.reduce((t, x) => t + x.n, 0) : 0;
  const minuto = `<section><div class="topo-sec"><h2>Minuto a minuto</h2><span class="sub">do início da busca até o cancelamento</span></div>
    <div class="numeros">
      <div><span>Até 1 min</span><b>${pc(totMin ? Math.round((1000 * ate(1)) / totMin) / 10 : null)}</b><small>${num(ate(1))} cancelamentos</small></div>
      <div><span>Até ${mb} min</span><b>${pc(totMin ? Math.round((1000 * ate(a.minBusca)) / totMin) / 10 : null)}</b><small>${num(ate(a.minBusca))} cancelamentos</small></div>
      <div><span>Até 10 min</span><b>${pc(totMin ? Math.round((1000 * ate(10)) / totMin) / 10 : null)}</b><small>${num(ate(10))} cancelamentos</small></div>
      <div><span>15 min ou mais</span><b>${pc(totMin ? Math.round((1000 * a.minutos[a.minutos.length - 1].n) / totMin) / 10 : null)}</b><small>${num(a.minutos[a.minutos.length - 1].n)} cancelamentos</small></div>
    </div>
    ${legenda([{ nome: 'Operacional', cor: COR.op }, { nome: 'Não operacional', cor: COR.naoOp }])}${grafMin}
    ${a.semMinuto ? `<p class="nota pe">${num(a.semMinuto)} cancelamento(s) sem horário de cancelamento ficaram fora do gráfico.</p>` : ''}</section>`;

  // distância: quantidade e taxa em gráficos separados (um eixo por gráfico)
  const ck = a.kms.map((x) => x.faixa);
  const dicaKm = (i) => { const x = a.kms[i]; return `<b>${esc(x.faixa)} km</b><br>${num(x.canc)} cancelados de ${num(x.dem)} pedidos<br>Taxa ${pc(x.taxa)}`; };
  const km = `<section><div class="topo-sec"><h2>Cancelamento por distância</h2><span class="sub">faixas de 1 km pela distância do pedido</span></div>
    <div class="duo"><div><h3 class="sub-h">Cancelados por faixa (km)</h3>${graf({ tipo: 'colunas', titulo: 'Cancelados por faixa de km', altura: 260, cats: ck, rotulos: true, series: [{ nome: 'Cancelados', cor: COR.volume, vals: a.kms.map((x) => x.canc) }], tip: dicaKm })}</div>
    <div><h3 class="sub-h">Taxa de cancelamento por faixa (km) · faixas com 10+ pedidos</h3>${graf({ tipo: 'colunas', titulo: 'Taxa de cancelamento por km', altura: 260, cats: ck, pct: true, rotulos: true, fmt: (v) => num(Math.round(v)) + '%', ref: r.taxa, refRot: `média ${pc(r.taxa)}`, series: [{ nome: 'Taxa', cor: COR.p2, vals: a.kms.map((x) => (x.dem >= BASE_MIN_PCT ? x.taxa : null)) }], tip: dicaKm })}</div></div>
    ${a.semKm ? `<p class="nota pe">${num(a.semKm)} pedido(s) sem distância (${num(a.semKmCanc)} cancelados) ficaram fora.</p>` : ''}</section>`;

  // modalidade
  const mods = a.modalidades;
  const modalidade = `<section><h2>Cancelamento por modalidade</h2><p class="nota">Taxa de cancelamento de cada modalidade e o tipo de cada cancelamento.</p>
    <div class="duo"><div><h3 class="sub-h">Taxa de cancelamento</h3>${hbarras(mods.map((m) => ({ rot: m.mod, sub: `${num(m.dem)} pedidos`, val: m.taxa, cor: COR[m.mod] || COR.Agendada, extra: ` <small>${num(m.canc)} de ${num(m.dem)}</small>`, tip: `<b>${esc(m.mod)}</b><br>${num(m.canc)} cancelados de ${num(m.dem)} pedidos (${pc(m.taxa)})<br>Operacional ${num(m.op)} · não operacional ${num(m.naoOp)}<br>${num(m.c5)} com menos de ${mb} min de busca · mediana ${min(m.medianaBusca)}` })), { max: Math.max(10, ...mods.map((m) => m.taxa || 0)) })}</div>
    <div><h3 class="sub-h">Operacional × não operacional</h3>${legenda([{ nome: 'Operacional', cor: COR.op }, { nome: 'Não operacional', cor: COR.naoOp }])}${hpilhas(mods.filter((m) => m.canc).map((m) => ({ rot: m.mod, sub: `${pc(m.pctC5)} com menos de ${mb} min`, partes: [{ nome: 'Operacional', val: m.op, cor: COR.op }, { nome: 'Não operacional', val: m.naoOp, cor: COR.naoOp }], valor: `${num(m.canc)}<small>cancelados</small>` })), { fmt: num })}</div></div></section>`;

  // hora do dia
  const ch = a.horas.map((x) => String(x.hora).padStart(2, '0') + 'h');
  const hora = `<section><div class="topo-sec"><h2>Cancelamento por hora do dia</h2><span class="sub">hora de criação do pedido · horas com 10+ pedidos</span></div>
    ${graf({ tipo: 'colunas', titulo: 'Taxa de cancelamento por hora', altura: 240, cats: ch, pct: true, ref: r.taxa, refRot: `média ${pc(r.taxa)}`, series: [{ nome: 'Taxa', cor: COR.p2, vals: a.horas.map((x) => (x.dem >= BASE_MIN_PCT ? x.taxa : null)) }], tip: (i) => { const x = a.horas[i]; return `<b>${ch[i]}</b><br>${num(x.canc)} cancelados de ${num(x.dem)} pedidos<br>Taxa ${pc(x.taxa)}`; } })}</section>`;

  // motivos, tipo e fase
  const ordemFase = ['Antes do aceite', 'Entregador a caminho ou na loja', 'Já em rota'];
  const fases = [...a.fases].sort((x, y) => ordemFase.indexOf(x.nome) - ordemFase.indexOf(y.nome)).map((f, i) => ({ nome: f.nome, val: f.n, cor: COR.fase[i] || COR.fase[2], claro: i === 0 }));
  const maxM = Math.max(1, ...a.motivos.map((m) => m.n));
  const motivos = `<section><h2>Motivos</h2><p class="nota">Motivo como foi registrado na API. Amarelo é operacional; cinza, os demais.${a.pendentes ? ` ${num(a.pendentes)} ainda sem leitura de motivo.` : ''}</p>
    <div class="duo"><div><h3 class="sub-h">Por tipo de motivo</h3>${segmentos(a.grupos.map((x) => ({ nome: x.nome, val: x.n, cor: x.op ? COR.op : COR.naoOp, claro: x.op })).slice(0, 6))}
      <h3 class="sub-h">Em que fase cancelou</h3>${segmentos(fases)}</div>
    <div><h3 class="sub-h">Tipos de motivo</h3>${hbarras(a.grupos.map((x) => ({ rot: x.nome, sub: x.op ? 'operacional' : 'não operacional', val: x.n, cor: x.op ? COR.op : COR.naoOp, extra: ` <small>${pc(x.pct)}</small>`, tip: `<b>${esc(x.nome)}</b><br>${num(x.n)} cancelamentos · ${pc(x.pct)}<br>${num(x.c5)} com menos de ${mb} min de busca<br>${num(x.antes)} antes do aceite` })), { max: Math.max(1, ...a.grupos.map((x) => x.n)), fmt: num })}</div></div>
    <h3 class="sub-h">Motivos como foram registrados</h3>${hbarras(a.motivos.slice(0, 12).map((m) => ({ rot: m.nome, sub: m.op ? 'operacional' : m.grupo, val: m.n, cor: m.op ? COR.op : COR.naoOp, extra: ` <small>${pc(m.pct)}</small>`, tip: `<b>${esc(m.nome)}</b><br>${num(m.n)} cancelamentos · ${pc(m.pct)}<br>${num(m.c5)} com menos de ${mb} min de busca · ${num(m.antes)} antes do aceite` })), { max: maxM, fmt: num, largo: true })}</section>`;

  // ranking das lojas (grupo): clicar escolhe a loja
  const ranking = daLoja ? '' : `<section><h2>Lojas que mais cancelam</h2><p class="nota">As 20 lojas com mais cancelamentos no período. Clique numa loja para abrir a análise dela.</p>
    <div class="rolagem"><table><thead><tr><th>Loja</th><th>Pedidos</th><th>Cancelados</th><th>Taxa</th><th>Operacional</th><th>Menos de ${mb} min</th><th>Antes do aceite</th><th class="txt">Principal motivo</th></tr></thead><tbody>${a.ranking.map((l) => `<tr class="clica" data-loja="${l.id}"><td class="loja">${esc(l.num)} · ${esc(l.bairro)}<small>${l.band}</small>${l.prio ? '<span class="star">★</span>' : ''}</td><td>${num(l.dem)}</td><td class="forte">${num(l.canc)}</td><td class="forte">${pc(l.taxa)}</td><td>${pc(l.pctOp)}</td><td>${pc(l.pctC5)}</td><td>${pc(l.pctAntes)}</td><td class="txt">${l.principal ? `${esc(l.principal.motivo)} (${num(l.principal.n)})` : '—'}</td></tr>`).join('')}</tbody></table></div></section>`;

  const lista = a.lista.length ? `<section><details data-chave="canc-lista"${daLoja ? ' open' : ''}><summary>${a.listaCortada ? `Ver os ${num(a.lista.length)} mais recentes de ${num(r.canc)} cancelamentos` : `Ver os ${num(a.lista.length)} cancelamentos, um a um`}</summary><div class="rolagem"><table><thead><tr><th>Data</th><th>Hora</th>${daLoja ? '' : '<th class="txt">Loja</th>'}<th class="txt">Modalidade</th><th>Min de busca</th><th>Min desde a criação</th><th class="txt">Fase</th><th class="txt">Motivo</th><th class="txt">Tipo</th><th>Pedido</th></tr></thead><tbody>${a.lista.map((x) => `<tr><td>${dataBr(x.dia).slice(0, 5)}</td><td class="forte">${esc(x.h)}</td>${daLoja ? '' : `<td class="txt">${esc(x.loja)} · ${esc(x.bairro)}</td>`}<td class="txt">${esc(x.mod || '—')}</td><td${x.minBusca != null && x.minBusca < a.minBusca ? ' class="quente"' : ''}>${min(x.minBusca)}</td><td>${min(x.minCriacao)}</td><td class="txt">${esc(x.fase)}</td><td class="txt">${esc(x.motivo)}</td><td class="txt">${x.op ? '<span class="tag" style="margin:0">Operacional</span>' : 'Não operacional'}</td><td>${esc(x.id)}</td></tr>`).join('')}</tbody></table></div></details></section>` : '';

  const regrasC = `<section><details><summary>Como cada número desta aba é calculado</summary><ul class="regras">
    <li><b>Base:</b> pedidos do período gravados um a um e a lista de cancelamentos com motivo lido na API. Escolhida uma loja, entram só os dela; a referência do grupo usa o mesmo período.</li>
    <li><b>Operacional:</b> falta de entregador ou atraso/problema do entregador. O resto (loja, cliente, outra transportadora, cadastro, integração) é não operacional.</li>
    <li><b>Minuto a minuto:</b> do início da busca por entregador até o cancelamento; pedido sem busca conta da criação.</li>
    <li><b>Distância:</b> a do pedido, em faixas de 1 km (0–1 km, 1–2 km…) e 10 km ou mais. Taxa = cancelados ÷ pedidos da faixa.</li>
    <li><b>Hora:</b> hora de criação do pedido. Faixa ou hora com menos de 10 pedidos fica fora dos gráficos de taxa, para não oscilar de 0 a 100% com um pedido.</li>
    <li><b>Pontos de atenção:</b> taxa 25% acima do grupo; metade ou mais cancelando com menos de 5 min; metade ou mais operacional; um motivo com 35% ou mais; faixa de km, modalidade ou hora com taxa 1,5 vez a da loja (1,4 vez na modalidade).</li>
  </ul></details></section>`;

  const abertos = [...document.querySelectorAll('#cancel details[open][data-chave]')].map((x) => x.dataset.chave);
  $('#cancel').innerHTML = filtro + kpis + atencao + minuto + km + modalidade + hora + motivos + ranking + lista + regrasC;
  for (const k of abertos) document.querySelector(`#cancel details[data-chave="${k}"]`)?.setAttribute('open', '');
  montarGraficos();
  const escolher = (id) => { lojaSel = id; try { localStorage.setItem('pm-loja', lojaSel); } catch {} carregarCanc(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('#selLojaCanc').addEventListener('change', (e) => escolher(e.target.value));
  for (const tr of document.querySelectorAll('#cancel tr.clica')) tr.addEventListener('click', () => escolher(tr.dataset.loja));
}

// ------------------------------------------------------------ aba Visitas externas
// /api/visitas: lojas visitadas do relatório contra as lojas ativas do cadastro, com os números do período.
let visDados = null, visEmVoo = false, visBusca = '';
async function carregarVisitas() {
  if (visEmVoo) return;
  visEmVoo = true;
  try {
    visDados = await (await fetch('/api/visitas?' + new URLSearchParams({ de: periodo.de, ate: periodo.ate }), { cache: 'no-store' })).json();
    desenharVisitas();
  } catch (e) {
    $('#visitas').innerHTML = `<section><p class="vazio">Não foi possível carregar as visitas (${esc(e.message)}).</p></section>`;
  } finally { visEmVoo = false; }
}

function desenharVisitas() {
  const j = visDados;
  if (!j?.lojas) { $('#visitas').innerHTML = '<section><p class="vazio">Nenhum relatório de visitas carregado.</p></section>'; return; }
  const m = j.meta, ls = j.lojas, vis = ls.filter((l) => l.visitada), nao = ls.filter((l) => !l.visitada);
  const p = (n, d) => (d ? Math.round((1000 * n) / d) / 10 : null);
  const pctVis = p(vis.length, ls.length);
  const band = (b) => { const t = ls.filter((l) => l.band === b), v = t.filter((l) => l.visitada).length; return { t: t.length, v, pct: p(v, t.length) }; };
  const pm = band('PM'), ef = band('EF');
  const prioT = ls.filter((l) => l.prio), prioV = prioT.filter((l) => l.visitada).length;
  const faixa = j.de === j.ate ? dataBr(j.de) : `${dataBr(j.de)} a ${dataBr(j.ate)}`;

  const topo = `<section class="hud"><div class="topo-sec"><h2>Visitas externas</h2><span class="sub">${esc(m.titulo)} · ${esc(m.periodoVisitas)} · responsável ${esc(m.responsavel)}</span></div>
    <p class="nota">Lojas visitadas segundo o relatório "${esc(m.fonte)}", comparadas com as ${num(ls.length)} lojas ativas de Pague Menos e Extrafarma no cadastro do painel${m.inativas ? ` (${num(m.inativas)} inativa fica fora)` : ''}.${m.qtdCabecalho && Number(m.qtdCabecalho) !== vis.length ? ` O cabeçalho do relatório diz ${esc(m.qtdCabecalho)} lojas, mas a lista traz ${num(vis.length)}; o painel usa a lista.` : ''}</p>
    <div class="rk">
      <div class="rk-t total"><span class="l">Lojas da rede</span><span class="v">${num(ls.length)}</span><span class="f">Pague Menos ${num(pm.t)} · Extrafarma ${num(ef.t)}</span></div>
      <div class="rk-t fin"><span class="l">Visitadas</span><span class="v">${num(vis.length)}</span><span class="f">${pc(pctVis)} da rede</span></div>
      <div class="rk-t canc"><span class="l">Ainda não visitadas</span><span class="v">${num(nao.length)}</span><span class="f">${pc(pctVis == null ? null : Math.round(1000 - 10 * pctVis) / 10)} da rede</span></div>
      <div class="rk-t and"><span class="l">Prioritárias visitadas</span><span class="v">${num(prioV)} de ${num(prioT.length)}</span><span class="f">${pc(p(prioV, prioT.length))} das lojas prioritárias</span></div>
    </div>
    <h3 class="sub-h">Cobertura da rede</h3>${segmentos([{ nome: 'Visitadas', val: vis.length, cor: COR.op, claro: true }, { nome: 'Ainda não visitadas', val: nao.length, cor: COR.naoOp }], { fmt: (v) => num(v) + ' lojas' })}
    <div class="duo" style="margin-top:6px"><div><h3 class="sub-h">Por bandeira</h3>${hbarras([
      { rot: 'Pague Menos', sub: `${num(pm.v)} de ${num(pm.t)} lojas`, val: pm.pct, cor: COR.PM, extra: ` <small>${num(pm.v)} de ${num(pm.t)}</small>`, tip: `<b>Pague Menos</b><br>${num(pm.v)} visitadas de ${num(pm.t)} · ${pc(pm.pct)}` },
      { rot: 'Extrafarma', sub: `${num(ef.v)} de ${num(ef.t)} lojas`, val: ef.pct, cor: COR.EF, extra: ` <small>${num(ef.v)} de ${num(ef.t)}</small>`, tip: `<b>Extrafarma</b><br>${num(ef.v)} visitadas de ${num(ef.t)} · ${pc(ef.pct)}` },
      { rot: 'Prioritárias', sub: 'lojas em observação', val: p(prioV, prioT.length), cor: COR.volume, extra: ` <small>${num(prioV)} de ${num(prioT.length)}</small>` },
    ], { max: 100 })}</div>
    <div><h3 class="sub-h">Por bairro · bairros com 2 lojas ou mais</h3>${(() => {
      const b = new Map();
      for (const l of ls) { const k = l.bairro.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(); const x = b.get(k) || { nome: l.bairro, t: 0, v: 0 }; x.t++; if (l.visitada) x.v++; b.set(k, x); }
      const lst = [...b.values()].filter((x) => x.t >= 2).sort((a, c) => c.t - a.t || c.v - a.v).slice(0, 14);
      return hbarras(lst.map((x) => ({ rot: x.nome, sub: `${num(x.t)} lojas`, val: p(x.v, x.t), cor: x.v ? COR.op : COR.naoOp, extra: ` <small>${num(x.v)} de ${num(x.t)}</small>`, tip: `<b>${esc(x.nome)}</b><br>${num(x.v)} visitadas de ${num(x.t)} lojas` })), { max: 100 });
    })()}</div></div></section>`;

  // próximas visitas: não visitadas com mais cancelamento no período
  const sugest = [...nao].filter((l) => l.dem).sort((a, b) => b.canc - a.canc || (b.taxaCanc || 0) - (a.taxaCanc || 0)).slice(0, 20);
  const linhaNum = (l) => `<td>${num(l.dem)}</td><td class="forte">${num(l.canc)}</td><td>${pc(l.taxaCanc)}</td><td>${pc(l.pctOp)}</td><td>${pc(l.otd)}</td>`;
  const nomeL = (l) => `<td class="loja">${l.num ? esc(l.num) + ' · ' : ''}${esc(l.bairro)}<small>${l.band}</small>${l.prio ? '<span class="star" title="Loja prioritária">★</span>' : ''}</td>`;
  const cabNum = '<th>Pedidos</th><th>Cancelados</th><th>Taxa</th><th>Operacional</th><th>OTD</th>';
  const proximas = `<section><h2>Próximas visitas sugeridas</h2><p class="nota">Lojas ainda não visitadas com mais cancelamentos em ${faixa} (período da barra acima). Operacional = falta ou problema do entregador.</p>
    ${sugest.length ? `<div class="rolagem"><table><thead><tr><th>Loja</th>${cabNum}</tr></thead><tbody>${sugest.map((l) => `<tr>${nomeL(l)}${linhaNum(l)}</tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Nenhuma loja não visitada com pedidos no período.</p>'}</section>`;

  // lojas visitadas: o que o relatório registrou e como estão agora
  const f = visBusca.trim().toLowerCase();
  const filtra = (arr) => arr.filter((l) => !f || `${l.num} ${l.bairro} ${l.nome}`.toLowerCase().includes(f));
  const visitadas = `<section><h2>Lojas visitadas</h2><p class="nota">No relatório: pedidos, canceladas e taxa de ${esc(m.periodoAnalisado)}, e o principal responsável e motivo de ${esc(m.periodoMotivos)}. Ao lado, os números do painel em ${faixa}.</p>
    <p><input id="buscaVis" type="search" placeholder="Buscar loja por número ou bairro" aria-label="Buscar loja" value="${esc(visBusca)}"></p>
    <div class="rolagem" id="tabVis"><table><thead><tr><th>Loja</th><th>Relatório: pedidos</th><th>Canceladas</th><th>Taxa</th><th class="txt">Principal responsável</th><th class="txt">Principal motivo</th><th class="sep">Painel: pedidos</th><th>Cancelados</th><th>Taxa</th><th>OTD</th></tr></thead><tbody>${filtra([...vis].sort((a, b) => (b.relatorio?.canc || 0) - (a.relatorio?.canc || 0))).map((l) => `<tr>${nomeL(l)}<td>${num(l.relatorio?.total)}</td><td class="forte">${num(l.relatorio?.canc)}</td><td>${esc(l.relatorio?.taxa || '—')}</td><td class="txt">${esc(l.motivo?.responsavel || '—')}</td><td class="txt">${esc(l.motivo?.motivo || '—')}</td><td class="sep">${num(l.dem)}</td><td class="forte">${num(l.canc)}</td><td>${pc(l.taxaCanc)}</td><td>${pc(l.otd)}</td></tr>`).join('')}</tbody></table></div></section>`;

  const todasNao = `<section><details data-chave="nao-visitadas"><summary>Ver as ${num(nao.length)} lojas ainda não visitadas</summary><div class="rolagem"><table><thead><tr><th>Loja</th>${cabNum}</tr></thead><tbody>${filtra([...nao].sort((a, b) => b.canc - a.canc || b.dem - a.dem)).map((l) => `<tr>${nomeL(l)}${linhaNum(l)}</tr>`).join('')}</tbody></table></div></details></section>`;

  const relato = `<section><h2>O que a visita encontrou</h2><p class="nota">Problemas mais recorrentes, como estão no relatório.</p>
    <div class="relato">${j.problemas.map((t) => `<p>${esc(t)}</p>`).join('')}</div>
    <h3 class="sub-h">Lojas por principal responsável e motivo de cancelamento</h3>
    <div class="rolagem"><table><thead><tr><th class="txt">Principal responsável</th><th class="txt">Principal motivo</th><th>Lojas</th></tr></thead><tbody>${j.responsaveis.map((r) => `<tr><td class="txt">${esc(r.responsavel)}</td><td class="txt">${esc(r.motivo)}</td><td class="forte">${num(r.lojas)}</td></tr>`).join('')}</tbody></table></div></section>`;

  const abertos = [...document.querySelectorAll('#visitas details[open][data-chave]')].map((x) => x.dataset.chave);
  $('#visitas').innerHTML = topo + proximas + visitadas + todasNao + relato;
  for (const k of abertos) document.querySelector(`#visitas details[data-chave="${k}"]`)?.setAttribute('open', '');
  montarGraficos();
  $('#buscaVis').addEventListener('input', (e) => { visBusca = e.target.value; const pos = e.target.selectionStart; desenharVisitas(); const el = $('#buscaVis'); el.focus(); el.setSelectionRange(pos, pos); });
}

// A página recarrega sozinha quando chega coleta nova
const vivo = $('#vivo');
function ligar() {
  const es = new EventSource('/api/eventos');
  es.onopen = () => { vivo.className = 'vivo on'; vivo.lastElementChild.textContent = 'conectado'; };
  es.onmessage = () => carregar();
  es.addEventListener('buscando', () => carregarBuscando());
  es.onerror = () => { vivo.className = 'vivo'; vivo.lastElementChild.textContent = 'reconectando'; };
}
mostrarAba();
carregarBuscando().catch(() => {}).finally(carregar);
carregarEvolucao();
setInterval(carregarEvolucao, 30 * 60e3).unref?.();
ligar();
</script>
</body>
</html>
