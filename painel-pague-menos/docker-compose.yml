# Compose da VPS (/opt/painel-pague-menos): sem portas publicadas — o acesso passa só pelo
# Caddy (container jurflow-caddy), que alcança este container pelo nome na rede do proxy.
services:
  painel-pague-menos:
    build: .
    container_name: painel-pague-menos
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./.env:/app/.env:ro
      - ./cache:/app/cache
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: jurflow-prod_default
