# Compose da VPS (vira /opt/painel-gm-consultoria/docker-compose.yml). Uso pessoal: um dono, uma chave.
# Sem portas publicadas: o acesso é pelo Caddy do jurflow (rede jurflow-prod_default), como os outros painéis,
# em https://gm.179-197-229-171.sslip.io (bloco pronto em Caddyfile.exemplo).
# O .env (fora do git; modelo em exemplo.env) traz PAINEL_SENHA, MCP_TOKEN e URL_PUBLICA.
services:
  painel-gm-consultoria:
    build: .
    image: painel-gm-consultoria:latest
    container_name: painel-gm-consultoria
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Fortaleza
    volumes:
      - ./dados:/app/dados
    networks:
      - jurflow-prod_default

networks:
  jurflow-prod_default:
    external: true
